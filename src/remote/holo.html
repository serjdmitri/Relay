<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050d14">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<title>Relay holograms</title>
</head>
<body class="holo-page">
<main id="list" hidden>
  <header><a class="back" href="/" aria-label="Back">&#8249;</a><span id="devtitle">Holograms</span></header>
  <p id="empty" class="dim" hidden>No holograms on your Mac right now. Ask Relay for one (“show me a 3D model of a skull”), then come back.</p>
  <ul id="tiles"></ul>
</main>
<main id="view" hidden>
  <header><a class="back" href="/holo.html" aria-label="Back">&#8249;</a><span id="vtitle">Hologram</span></header>
  <canvas id="gl"></canvas>
  <div id="vhint" class="dim">Drag to turn · pinch to zoom</div>
  <div id="vtools"><button id="tcut" type="button">Cut</button><button id="tedit" type="button">Edit</button></div>
  <section id="pcut" class="panel" hidden>
    <div class="prow"><span class="plbl">Cut through it</span><span id="cutax"><button type="button" data-ax="0" aria-label="Left to right">&#8596;</button><button type="button" data-ax="1" class="on" aria-label="Up and down">&#8597;</button><button type="button" data-ax="2" aria-label="Front to back">&#9678;</button></span><button id="cutflip" type="button" aria-label="Cut away the other side">&#8644;</button></div>
    <input id="cutr" type="range" min="-100" max="100" value="100" aria-label="Where to cut">
  </section>
  <section id="pedit" class="panel" hidden>
    <form id="tell"><input id="tellin" type="text" placeholder="Tell Relay what to change…" enterkeyhint="send" autocomplete="off"><button type="submit">Send</button></form>
    <div id="cadbox" hidden>
      <div id="chips"></div>
      <div id="fields"></div>
      <div id="cadact"><button type="button" id="cHole">Make hole</button><button type="button" id="cCopy">Copy</button><button type="button" id="cDel">Delete</button><button type="button" id="cUndo">Undo</button></div>
      <div id="addrow"></div>
    </div>
  </section>
  <div id="vbar">
    <button data-fmt="stl">STL</button>
    <button data-fmt="3mf">3MF</button>
    <button data-fmt="step">STEP</button>
  </div>
  <div id="vmsg" class="dim"></div>
</main>
<script type="module" src="/holo.js"></script>
</body>
</html>
