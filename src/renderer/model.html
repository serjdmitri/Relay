<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data:;">
<style>
  /* The 3D viewer: the same black glass as the answer card. Drag to turn it, scroll to zoom, double-click to reset. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: #f4f7fa; -webkit-font-smoothing: antialiased; user-select: none; }
  body { display: flex; align-items: center; justify-content: center; }
  .win { position: relative; width: 600px; height: 540px; background: #000; border-radius: 26px; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16), inset 0 1px 0 rgba(255, 255, 255, .34), 0 18px 46px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .5);
    transform-origin: 100% 50%; opacity: 0; transform: translateX(60px) scale(.2, .55); filter: blur(14px); pointer-events: none; }
  body.show .win { pointer-events: auto; animation: pop .5s cubic-bezier(.2, .9, .25, 1) forwards; }
  body.hide .win { animation: tuck .3s cubic-bezier(.5, 0, .75, .4) forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translateX(60px) scale(.2, .55); filter: blur(14px); border-radius: 80px; } 40% { opacity: 1; transform: translateX(-6px) scale(1.04, 1.02); filter: blur(2px); border-radius: 32px; } 100% { opacity: 1; transform: none; filter: blur(0); border-radius: 26px; } }
  @keyframes tuck { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateX(64px) scale(.16, .5); filter: blur(14px); border-radius: 90px; } }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; } canvas:active { cursor: grabbing; }
  .top { position: absolute; left: 0; right: 0; top: 0; padding: 18px 22px 40px; background: linear-gradient(180deg, rgba(0, 0, 0, .85), rgba(0, 0, 0, 0)); pointer-events: none; }
  h1 { font-size: 19px; font-weight: 650; padding-right: 34px; } .sub { margin-top: 2px; color: #6fd3ff; font-size: 12.5px; }
  .x { position: absolute; top: 14px; right: 14px; z-index: 3; width: 28px; height: 28px; border-radius: 50%; background: rgba(0, 0, 0, .6); display: grid; place-items: center; font-size: 16px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .22); }
  .x:hover { background: rgba(255, 255, 255, .22); }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 36px 22px 14px; background: linear-gradient(0deg, rgba(0, 0, 0, .85), rgba(0, 0, 0, 0)); font-size: 11px; color: rgba(255, 255, 255, .5); pointer-events: none; display: flex; justify-content: space-between; gap: 12px; }
  .bottom span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .up { position: absolute; right: 22px; top: 52px; z-index: 3; padding: 5px 12px; border-radius: 999px; background: rgba(111, 211, 255, .14); color: #6fd3ff; font-size: 12px; font-weight: 600; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(111, 211, 255, .3); display: none; } .up:hover { background: rgba(111, 211, 255, .28); }
  .load { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255, 255, 255, .6); pointer-events: none; }
</style>
</head>
<body>
<div class="win" id="win">
  <canvas id="cv"></canvas>
  <div class="top"><h1 id="title"></h1><div class="sub" id="sub"></div></div>
  <div class="x" id="x">&times;</div>
  <div class="up" id="up">Turn upright</div>
  <div class="load" id="load"></div>
  <div class="bottom"><span id="credit"></span><span>Drag to turn · scroll to zoom · double-click to reset</span></div>
</div>
<script type="module" src="model.js"></script>
</body>
</html>
