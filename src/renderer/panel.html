<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A model-built panel is shown in a frame that inherits this policy and then adds its own, much tighter one (only the hosts you approved), so the
     two together are what applies to it. This page itself only ever sets text with textContent. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https:; img-src 'self' data: https:; font-src data:; frame-src about: data:">
<title>Panel</title>
<style>
  :root { --bg: rgba(10, 24, 36, .9); --line: rgba(0, 212, 255, .5); --ink: #cdf4ff; --dim: #6fa8bd; --accent: #00d4ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: var(--ink); }
  #card { position: absolute; inset: 6px; display: flex; flex-direction: column; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); box-shadow: 0 6px 22px rgba(0, 0, 0, .45), inset 0 0 18px rgba(0, 212, 255, .12); overflow: hidden; }
  #bar { flex: 0 0 24px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 12px; -webkit-app-region: drag; cursor: grab; user-select: none; border-bottom: 1px solid rgba(0, 212, 255, .2); }
  #bar span { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  #x { -webkit-app-region: no-drag; width: 16px; height: 16px; line-height: 15px; text-align: center; border-radius: 50%; font-size: 12px; cursor: pointer; color: var(--dim); }
  #x:hover { background: rgba(255, 255, 255, .12); color: #fff; }
  #body { flex: 1; min-height: 0; padding: 10px 12px; overflow: auto; }
  iframe { width: 100%; height: 100%; border: 0; background: transparent; }
  .m { margin-bottom: 10px; } .m .l { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); } .m .v { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 3px; background: rgba(0, 212, 255, .15); margin-top: 4px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .5s; }
  .job { font-size: 12px; padding: 3px 0; border-top: 1px solid rgba(0, 212, 255, .12); } .job small { color: var(--dim); }
  pre { margin: 0; font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
  .err { color: #ff9f0a; font-size: 12px; }
</style>
</head>
<body>
  <div id="card">
    <div id="bar"><span id="title">Panel</span><div id="x" title="Close this panel">×</div></div>
    <div id="body"></div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
