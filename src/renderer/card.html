<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'self' 'unsafe-inline';">
<style>
  /* The answer card: black glass like the Recent menu. The picture is embedded (data:), so this page never touches the web. */
  :root { --ink: #f4f7fa; --dim: rgba(240, 246, 252, .62); --acc: #6fd3ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }
  body { display: flex; align-items: center; justify-content: center; }
  .card { position: relative; width: 420px; max-height: calc(100vh - 28px); overflow-y: auto; scrollbar-width: none; background: #000; border-radius: 26px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16), inset 0 1px 0 rgba(255, 255, 255, .34), 0 18px 46px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .5);
    transform-origin: 100% 50%; opacity: 0; transform: translateX(60px) scale(.2, .55); filter: blur(14px); pointer-events: none; }
  .card::-webkit-scrollbar { display: none; }
  body.show .card { pointer-events: auto; animation: pop .62s cubic-bezier(.2, .9, .25, 1) forwards; }
  body.hide .card { animation: tuck .42s cubic-bezier(.5, 0, .75, .4) forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translateX(60px) scale(.2, .55); filter: blur(14px); border-radius: 80px; } 38% { opacity: 1; transform: translateX(-6px) scale(1.06, 1.03); filter: blur(2px); border-radius: 32px; } 62% { transform: translateX(2px) scale(.99); filter: blur(0); } 100% { opacity: 1; transform: none; filter: blur(0); border-radius: 4px; } }
  @keyframes tuck { 0% { opacity: 1; transform: none; filter: blur(0); } 35% { opacity: 1; transform: translateX(-6px) scale(1.03); filter: blur(1px); } 100% { opacity: 0; transform: translateX(64px) scale(.16, .5); filter: blur(14px); border-radius: 90px; } }
  .hero { position: relative; height: 236px; background: #0b1218; }
  .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, 0) 45%, #000 100%); }
  .credit { position: absolute; left: 14px; bottom: 6px; z-index: 1; font-size: 9.5px; color: rgba(255, 255, 255, .5); max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .x { position: absolute; top: 12px; right: 12px; z-index: 2; width: 26px; height: 26px; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff; display: grid; place-items: center; font-size: 15px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2); }
  .x:hover { background: rgba(255, 255, 255, .2); }
  .body { padding: 14px 22px 20px; }
  .card.noimg .body { padding-top: 22px; }
  h1 { font-size: 21px; font-weight: 650; letter-spacing: .005em; padding-right: 26px; }
  .sub { margin-top: 2px; color: var(--acc); font-size: 12.5px; }
  .sum { margin-top: 10px; color: var(--dim); font-size: 13.5px; line-height: 1.5; }
  .facts { margin-top: 14px; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, .06); box-shadow: inset 0 .5px 0 rgba(255, 255, 255, .16); }
  .facts dt { color: var(--dim); font-size: 12px; } .facts dd { font-size: 13px; font-weight: 550; }
  .links { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .link { padding: 6px 14px; border-radius: 999px; background: rgba(111, 211, 255, .14); color: var(--acc); font-size: 12.5px; font-weight: 600; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(111, 211, 255, .3); }
  .link:hover { background: rgba(111, 211, 255, .26); }
  .list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 16px; background: rgba(255, 255, 255, .06); box-shadow: inset 0 .5px 0 rgba(255, 255, 255, .16); }
  .item.go { cursor: pointer; position: relative; padding-right: 34px; } .item.go:hover { background: rgba(255, 255, 255, .13); }
  .item.go::after { content: "\2197"; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--acc); opacity: .55; font-size: 15px; transition: opacity .15s, transform .15s; }
  .item.go:hover::after { opacity: 1; transform: translateY(-50%) translate(2px, -2px); }
  .thumb { width: 58px; height: 58px; border-radius: 12px; flex: none; background: #0f1a22 center/cover; }
  .it { min-width: 0; } .it b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it span { display: block; color: var(--dim); font-size: 12px; } .it i { display: block; font-style: normal; color: var(--acc); font-size: 11.5px; margin-top: 1px; }
  .card.weather { width: calc(100vw - 32px); border-radius: 10px; border: 1px solid #2ba8d8; background: linear-gradient(145deg, #08243e, #0c4b80 55%, #07203b); box-shadow: inset 0 0 45px #0a2645, 0 0 24px #00c9ff55; }
  .weather-inner { padding: 24px; background-image: linear-gradient(#45d6ff0d 1px, transparent 1px), linear-gradient(90deg, #45d6ff0d 1px, transparent 1px); background-size: 32px 32px; }
  .weather-kicker, .weather-graph-label { color: #64dfff; font-size: 10px; font-weight: 700; letter-spacing: .18em; }
  .weather-title { font-size: clamp(20px, 3vw, 30px); text-transform: uppercase; padding-right: 32px; }
  .weather-source { color: #c4e5f4; font-size: 11px; margin: 4px 0 16px; border-bottom: 1px solid #5cdcff66; padding-bottom: 12px; }
  .weather-close { position: absolute; z-index: 3; right: 16px; top: 15px; background: #082e4c; border: 1px solid #62ddff; color: white; width: 30px; height: 30px; font-size: 21px; cursor: pointer; }
  .weather-close:focus-visible { outline: 2px solid white; outline-offset: 3px; }
  .weather-main { display: flex; justify-content: space-between; align-items: center; gap: 22px; }
  .weather-hero { display: flex; align-items: center; gap: 22px; min-width: 0; }
  .weather-symbol { color: #e2f9ff; font-size: 70px; text-shadow: 0 0 24px #60e3ff; }
  .weather-temp { font-size: 62px; font-weight: 700; line-height: 1; }
  .weather-condition { color: #6ce6ff; font-weight: 700; text-transform: uppercase; }
  .weather-feels { color: #c2e3f3; margin-top: 3px; font-size: 11px; }
  .weather-metrics { flex: 0 1 310px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; border: 1px solid #6bd7ff66; background: #082a4a99; padding: 13px; }
  .weather-metric span, .weather-metric strong { display: block; } .weather-metric span { color: #a0cfe2; font-size: 9px; } .weather-metric strong { font-size: 14px; }
  .weather-graph { margin: 20px 0 15px; } .weather-graph svg { display: block; width: 100%; height: 64px; filter: drop-shadow(0 0 5px #16c8ff); }
  .weather-hour-labels { display: flex; justify-content: space-between; color: #c4e6f5; font-size: 10px; }
  .weather-days { display: grid; grid-template-columns: repeat(7, minmax(96px, 1fr)); gap: 6px; overflow-x: auto; padding: 4px 0; }
  .weather-day { border: 1px solid #49b7db88; background: #082e50b8; padding: 9px 7px; min-width: 0; text-align: center; }
  .weather-day.today { background: #086c9a; border-color: #67e4ff; } .weather-day-label { color: #9cecff; font-size: 10px; font-weight: 700; }
  .weather-day-icon { font-size: 26px; color: #f3fcff; } .weather-day-condition { color: #bfe8f4; font-size: 10px; min-height: 28px; }
  .weather-day-temps { font-size: 14px; font-weight: 700; } .weather-day-rain { color: #a9eaff; font-size: 9px; }
  @media (max-width: 580px) { .weather-main { align-items: stretch; flex-direction: column; } .weather-metrics { flex-basis: auto; grid-template-columns: repeat(3, 1fr); } .weather-inner { padding: 17px; } }
  @media (prefers-reduced-motion: reduce) { body.show .card, body.hide .card { animation-duration: .01ms; } }
  /* Shared JARVIS treatment for floating answer cards; the separate side menu keeps its shape. */
  .card:not(.weather) { border-radius: 4px; border: 1px solid #2ba8d8; background: linear-gradient(145deg, #08243e, #0c3a60 70%, #07203b); box-shadow: inset 0 0 32px #0a2645, 0 0 18px #00c9ff44; }
  .card:not(.weather) .body { background-image: linear-gradient(#45d6ff0d 1px, transparent 1px), linear-gradient(90deg, #45d6ff0d 1px, transparent 1px); background-size: 32px 32px; }
  .card:not(.weather) .item, .card:not(.weather) .facts { border-radius: 3px; background: #082e50b8; box-shadow: inset 0 0 0 1px #49b7db88; }
  .card:not(.weather) .thumb { border-radius: 2px; }
  .card:not(.weather) .link, .card:not(.weather) .x { border-radius: 2px; }
  .card h1, .weather-kicker, .weather-source { -webkit-app-region: drag; cursor: grab; user-select: none; }
  .card .x, .weather-close { -webkit-app-region: no-drag; }
</style>
<link rel="stylesheet" href="jarvis-surface.css">
</head>
<body>
<div class="card" id="card"></div>
<script src="card.js"></script>
<script src="menu-opacity.js"></script>
</body>
</html>
