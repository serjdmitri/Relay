<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'"><title>Assignments</title><link rel="stylesheet" href="jarvis-surface.css"><link rel="stylesheet" href="storage.css"><link rel="stylesheet" href="assignments.css"></head><body><main id="card"><header id="bar"><strong>JARVIS / ASSIGNMENTS</strong><button id="x" aria-label="Close assignments">×</button></header><section id="controls"><button id="refresh">Refresh from school page</button><button id="source">Open school page</button><span id="stamp"></span></section><p id="status" role="status">Loading your assignments…</p><section id="body"><div id="summary"></div><div id="filters"><label>Class <select id="f-course"></select></label><label>Due <select id="f-due"><option value="all">Any time</option><option value="soon">Overdue, today or this week</option><option value="overdue">Overdue</option><option value="today">Today</option><option value="week">Next 7 days</option><option value="later">Later</option><option value="nodate">No readable date</option></select></label><label>Priority <select id="f-priority"><option value="all">Any</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option><option value="unknown">No date</option></select></label><input id="f-query" type="search" placeholder="Search title or class" aria-label="Search assignments"></div><div id="list"></div></section><footer>Read-only: only what your school page shows · Priority comes from the due date, since the page has no priority · Links open your school page, not the single assignment</footer></main><script src="assignments.js"></script><script src="menu-opacity.js"></script></body></html>
