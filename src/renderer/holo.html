<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data:;">
<style>
  /* A hologram: no window, no border, no background. Only light. The controls are glowing glyphs that appear when the pointer is near. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; font: 13px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: #bff4ff; -webkit-font-smoothing: antialiased; user-select: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .glow { text-shadow: 0 0 6px rgba(0, 212, 255, .9), 0 0 16px rgba(0, 160, 230, .6); }
  #cap { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; pointer-events: none; transition: opacity .3s; }
  #title { font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  #credit { margin-top: 3px; font-size: 10.5px; letter-spacing: .04em; opacity: .65; }
  #ctl { position: absolute; left: 0; right: 0; bottom: 56px; display: flex; justify-content: center; gap: 4px; opacity: 0; transition: opacity .25s; }
  body.near #ctl { opacity: 1; }
  .btn { min-width: 32px; height: 30px; padding: 0 9px; display: grid; place-items: center; font-size: 17px; cursor: pointer; border-radius: 999px; color: #8be9ff; text-shadow: 0 0 8px rgba(0, 212, 255, .95); }
  .btn:hover { color: #fff; background: rgba(0, 212, 255, .18); box-shadow: 0 0 14px rgba(0, 212, 255, .45); }
  .btn.on { color: #fff; text-shadow: 0 0 10px #00d4ff, 0 0 22px #00d4ff; }
  .btn[hidden] { display: none; }
  #opt { font-size: 12px; letter-spacing: .08em; align-self: center; padding: 0 2px; min-width: 34px; text-align: center; }
  #merge { position: absolute; left: 0; right: 0; top: 12px; text-align: center; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: 0; transition: opacity .2s; pointer-events: none; }
  body.merging #merge { opacity: 1; animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  #err { position: absolute; left: 0; right: 0; top: 46%; text-align: center; color: #ffcc66; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="merge" class="glow">Release to combine</div>
<div id="err" class="glow"></div>
<div id="ctl" class="glow">
  <div class="btn" id="prev" hidden title="Another model">&#8249;</div><div id="opt" hidden></div><div class="btn" id="next" hidden title="Another model">&#8250;</div>
  <div class="btn" id="upright" hidden title="Turn upright">&#8635;</div>
  <div class="btn" id="solid" title="Solid or hologram">&#9680;</div>
  <div class="btn" id="pin" title="Keep on my screen">&#9906;</div>
  <div class="btn" id="close" title="Take it away">&#10005;</div>
</div>
<div id="cap" class="glow"><div id="title"></div><div id="credit"></div></div>
<script type="module" src="holo.js"></script>
</body>
</html>
