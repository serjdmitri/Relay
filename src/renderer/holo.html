<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data:;">
<style>
  /* A hologram: no window, no border, no background. Only light. The controls are glowing glyphs that appear when the pointer is near. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; font: 13px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: #bff4ff; -webkit-font-smoothing: antialiased; user-select: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .glow { text-shadow: 0 0 6px rgba(0, 212, 255, .9), 0 0 16px rgba(0, 160, 230, .6); }
  /* the labels and controls travel with the model: the stage is a box around it, put in place by the page */
  #stage { position: absolute; width: 460px; pointer-events: none; }
  #cap { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; transition: opacity .3s; }
  #title { display: inline-block; padding: 2px 10px; font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; cursor: move; pointer-events: auto; }
  #credit { margin-top: 3px; font-size: 10.5px; letter-spacing: .04em; opacity: .65; pointer-events: none; }
  #ctl { position: absolute; left: 0; right: 0; bottom: 56px; display: flex; justify-content: center; gap: 4px; opacity: 0; transition: opacity .25s; }
  body.near #ctl { opacity: 1; }
  .btn { min-width: 32px; height: 30px; padding: 0 9px; display: grid; place-items: center; font-size: 17px; cursor: pointer; border-radius: 999px; color: #8be9ff; text-shadow: 0 0 8px rgba(0, 212, 255, .95); pointer-events: auto; }
  .btn:hover { color: #fff; background: rgba(0, 212, 255, .18); box-shadow: 0 0 14px rgba(0, 212, 255, .45); }
  .btn.on { color: #fff; text-shadow: 0 0 10px #00d4ff, 0 0 22px #00d4ff; }
  .btn[hidden] { display: none; }
  #move { cursor: move; }
  #opt { font-size: 12px; letter-spacing: .08em; align-self: center; padding: 0 2px; min-width: 34px; text-align: center; }
  #merge { position: absolute; left: 0; right: 0; top: -4px; text-align: center; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: 0; transition: opacity .2s; pointer-events: none; }
  body.merging #merge { opacity: 1; animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  #hint2 { position: absolute; left: -60px; right: -60px; top: -26px; text-align: center; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: 0; transition: opacity .25s; pointer-events: none; } body.exploded #hint2, body.editing #hint2, body.hinting #hint2 { opacity: .85; } body.merging #hint2 { opacity: 0; }
  #cad { position: absolute; left: 0; top: 0; width: 0; height: 0; display: none; }
  body.editing #cad { display: block; }
  .cadcol { position: absolute; top: 0; transform: translateY(-50%); display: flex; flex-direction: column; gap: 3px; font-size: 13px; letter-spacing: .04em; color: #bff4ff; text-shadow: 0 0 6px rgba(0, 212, 255, .8), 0 1px 3px rgba(0, 8, 20, .9); }
  #cadL { width: 130px; right: 0; align-items: flex-end; text-align: right; }
  #cadR { width: 210px; left: 0; }
  .cadui { pointer-events: auto; cursor: pointer; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .cadui:hover { background: rgba(0, 212, 255, .16); color: #fff; }
  .cadui.off { opacity: .35; pointer-events: none; }
  .cadui.on { color: #fff; text-shadow: 0 0 10px #00d4ff; }
  .cadh { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .6; padding: 6px 8px 0; }
  .shp { display: flex; align-items: center; gap: 6px; }
  .shp i { width: 7px; height: 7px; border-radius: 50%; background: #00d4ff; display: inline-block; }
  .shp.hole i { background: #ff9f43; }
  .shp.sel { color: #fff; text-shadow: 0 0 10px #00d4ff; }
  .row { display: flex; gap: 8px; align-items: center; padding: 1px 8px; }
  .row b { width: 14px; font-weight: 400; opacity: .6; }
  .num { pointer-events: auto; cursor: ew-resize; min-width: 52px; text-align: right; padding: 1px 6px; border-radius: 6px; }
  .num:hover { background: rgba(0, 212, 255, .16); color: #fff; }
  .unit { opacity: .5; font-size: 11px; }
  #tip { position: absolute; left: 0; top: 0; padding: 4px 10px; border-radius: 999px; background: rgba(4, 18, 28, .78); font-size: 12px; letter-spacing: .04em; white-space: nowrap; opacity: 0; transition: opacity .12s; pointer-events: none; color: #d9f8ff; }
  #tip.show { opacity: 1; }
  #err { position: absolute; left: 0; right: 0; top: 46%; text-align: center; color: #ffcc66; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage">
  <div id="merge" class="glow">Release to combine</div>
  <div id="hint2" class="glow"></div>
  <div id="err" class="glow"></div>
  <div id="ctl" class="glow">
    <div class="btn" id="move" data-tip="Move: drag this to put it anywhere">&#10021;</div>
    <div class="btn" id="prev" hidden data-tip="Previous model">&#8249;</div><div id="opt" hidden></div><div class="btn" id="next" hidden data-tip="Next model">&#8250;</div>
    <div class="btn" id="ask" data-tip="Ask about it (click a piece first to ask about just that piece)">?</div>
    <div class="btn" id="edit" hidden data-tip="Edit the shapes: resize, move, add, remove, cut holes">&#9998;</div>
    <div class="btn" id="explode" data-tip="Pull it apart into pieces (or double-click it)">&#10070;</div>
    <div class="btn" id="reset" data-tip="Turn it back to the front">&#8982;</div>
    <div class="btn" id="upright" hidden data-tip="Turn it upright">&#8635;</div>
    <div class="btn" id="solid" data-tip="Switch between hologram and solid">&#9680;</div>
    <div class="btn" id="save" data-tip="Save it as an STL file (for 3D printing, Fusion and other apps)">&#10515;</div>
    <div class="btn" id="pin" data-tip="Keep it: stays when I say close, and after a restart">&#9906;</div>
    <div class="btn" id="close" data-tip="Close just this one">&#10005;</div>
  </div>
  <div id="cap" class="glow"><div id="title" data-tip="Drag the name to move it anywhere"></div><div id="credit"></div></div>
</div>
<div id="cad"><div id="cadL" class="cadcol"></div><div id="cadR" class="cadcol"></div></div>
<div id="tip"></div>
<script type="module" src="holo.js"></script>
</body>
</html>
