<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data:;">
<style>
  /* A hologram: no window, no border, no background. Only light. The controls are glowing glyphs that appear when the pointer is near. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; font: 13px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: #bff4ff; -webkit-font-smoothing: antialiased; user-select: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .glow { text-shadow: 0 0 6px rgba(0, 212, 255, .9), 0 0 16px rgba(0, 160, 230, .6); }
  /* the labels and controls travel with the model: the stage is a box around it, put in place by the page */
  #stage { position: absolute; width: 460px; pointer-events: none; }
  /* everything below or beside the model, never over it. --mr is the model's radius in pixels (set by the page) */
  #stage { --mr: 180px; }
  #cap { position: absolute; left: 0; right: 0; top: calc(50% + var(--mr) + 2px); text-align: center; transition: opacity .3s; }
  #title { display: inline-block; padding: 2px 10px; font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; cursor: move; pointer-events: auto; }
  #credit { margin: 3px auto 0; max-width: 420px; font-size: 10.5px; letter-spacing: .04em; opacity: .65; pointer-events: none; }
  #ctl { position: absolute; left: 0; right: 0; top: calc(50% + var(--mr) + 58px); display: flex; justify-content: center; align-items: center; gap: 6px; opacity: 0; transition: opacity .25s; }
  body.near #ctl, body.menu-open #ctl { opacity: 1; }
  #nav { display: flex; align-items: center; gap: 2px; }
  #items { display: flex; gap: 4px; }
  .btn { min-width: 32px; height: 30px; padding: 0 9px; display: grid; place-items: center; font-size: 17px; cursor: pointer; border-radius: 999px; color: #8be9ff; text-shadow: 0 0 8px rgba(0, 212, 255, .95); pointer-events: auto; }
  .btn:hover { color: #fff; background: rgba(0, 212, 255, .18); box-shadow: 0 0 14px rgba(0, 212, 255, .45); }
  .btn.on { color: #fff; text-shadow: 0 0 10px #00d4ff, 0 0 22px #00d4ff; }
  .btn[hidden] { display: none; }
  #more { display: none; letter-spacing: 2px; font-weight: 700; }
  #move { cursor: move; }
  #opt { font-size: 12px; letter-spacing: .08em; align-self: center; padding: 0 2px; min-width: 34px; text-align: center; }
  /* style: menu (one ⋯ button that opens the list) */
  body.ui-menu #more { display: grid; }
  body.ui-menu #items { display: none; position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); flex-direction: column; gap: 2px; padding: 6px; border-radius: 16px; background: rgba(4, 16, 26, .82); box-shadow: 0 0 0 1px rgba(0, 212, 255, .25), 0 8px 30px rgba(0, 0, 0, .5); }
  body.ui-menu.menu-open #items { display: flex; }
  body.ui-menu #items .btn { justify-content: start; grid-template-columns: 26px auto; gap: 10px; border-radius: 10px; height: 32px; min-width: 150px; font-size: 16px; padding: 0 12px; text-shadow: none; }
  body.ui-menu #items .btn::after { content: attr(data-name); font-size: 13px; letter-spacing: .04em; color: #d9f8ff; }
  body.ui-menu #items .btn > * { display: none; }
  /* style: side (a slim column beside the model) */
  body.ui-side #ctl { top: 50%; left: calc(50% + var(--mr) + 16px); right: auto; transform: translateY(-50%); flex-direction: column; align-items: flex-start; gap: 4px; }
  body.ui-side #items { flex-direction: column; gap: 0; }
  body.ui-side .btn { min-width: 30px; height: 28px; font-size: 16px; }
  /* the cut bar: sits above the model */
  #cutbar { position: absolute; left: 50%; top: calc(50% - var(--mr) - 74px); transform: translateX(-50%); width: 270px; padding: 8px 12px 10px; border-radius: 16px; background: rgba(4, 16, 26, .82); box-shadow: 0 0 0 1px rgba(0, 212, 255, .3), 0 8px 30px rgba(0, 0, 0, .5); display: none; pointer-events: auto; }
  body.cutting #cutbar { display: block; }
  .cutrow { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .cutlbl { flex: 1; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8be9ff; }
  #cutax { display: flex; gap: 2px; }
  #cutbar b { min-width: 26px; height: 24px; padding: 0 6px; display: grid; place-items: center; font-size: 13px; font-weight: 600; border-radius: 999px; cursor: pointer; color: #8be9ff; }
  #cutbar b:hover { color: #fff; background: rgba(0, 212, 255, .18); }
  #cutbar b.on { color: #04121c; background: #4cc2ff; }
  #cutr { width: 100%; height: 22px; margin: 0; accent-color: #4cc2ff; cursor: pointer; }
  body.hand #cutbar { width: 460px; padding: 14px 18px 16px; top: calc(50% - var(--mr) - 120px); }
  body.hand #cutbar b { min-width: 46px; height: 44px; font-size: 20px; }
  body.hand .cutlbl { font-size: 18px; }
  body.hand #cutr { height: 44px; }
  /* measuring: a label at the middle of the line between two points */
  #mlabel { position: fixed; left: 0; top: 0; transform: translate(-50%, -140%); padding: 3px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; letter-spacing: .04em; color: #04121c; background: #4cc2ff; box-shadow: 0 0 14px rgba(0, 212, 255, .6); pointer-events: none; display: none; white-space: nowrap; z-index: 5; }
  body.hand #mlabel { font-size: 24px; padding: 5px 16px; }
  #merge { position: absolute; left: 0; right: 0; top: -4px; text-align: center; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: 0; transition: opacity .2s; pointer-events: none; }
  body.merging #merge { opacity: 1; animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  #hint2 { position: absolute; left: -60px; right: -60px; top: -26px; text-align: center; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: 0; transition: opacity .25s; pointer-events: none; } body.exploded #hint2, body.editing #hint2, body.hinting #hint2 { opacity: .85; } body.merging #hint2 { opacity: 0; }
  #cad { position: absolute; left: 0; top: 0; width: 0; height: 0; display: none; }
  body.editing #cad { display: block; }
  .cadcol { position: absolute; top: 0; transform: translateY(-50%); display: flex; flex-direction: column; gap: 3px; font-size: 13px; letter-spacing: .04em; color: #bff4ff; text-shadow: 0 0 6px rgba(0, 212, 255, .8), 0 1px 3px rgba(0, 8, 20, .9); }
  #cadL { width: 130px; right: 0; align-items: flex-end; text-align: right; }
  #cadR { width: 210px; left: 0; }
  .cadui { pointer-events: auto; cursor: pointer; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .cadui:hover { background: rgba(0, 212, 255, .16); color: #fff; }
  .cadui.off { opacity: .35; pointer-events: none; }
  .cadui.on { color: #fff; text-shadow: 0 0 10px #00d4ff; }
  .cadh { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .6; padding: 6px 8px 0; }
  .shp { display: flex; align-items: center; gap: 6px; }
  .shp i { width: 7px; height: 7px; border-radius: 50%; background: #00d4ff; display: inline-block; }
  .shp.hole i { background: #ff9f43; }
  .shp.sel { color: #fff; text-shadow: 0 0 10px #00d4ff; }
  .row { display: flex; gap: 8px; align-items: center; padding: 1px 8px; }
  .row b { width: 14px; font-weight: 400; opacity: .6; }
  .num { pointer-events: auto; cursor: ew-resize; min-width: 52px; text-align: right; padding: 1px 6px; border-radius: 6px; }
  .num:hover { background: rgba(0, 212, 255, .16); color: #fff; }
  .unit { opacity: .5; font-size: 11px; }
  /* hands in use: big, easy-to-hit controls, always shown */
  body.hand #ctl { opacity: 1; gap: 12px; top: calc(50% + var(--mr) + 70px); }
  body.hand .btn { min-width: 64px; height: 60px; font-size: 32px; padding: 0 14px; }
  body.hand.ui-menu #items .btn { height: 64px; min-width: 260px; font-size: 30px; }
  body.hand.ui-menu #items .btn::after { font-size: 22px; }
  body.hand.ui-side #ctl { left: calc(50% + var(--mr) + 24px); }
  body.hand #opt { font-size: 18px; min-width: 56px; }
  body.hand #title { font-size: 20px; }
  body.hand .cadui { font-size: 17px; padding: 6px 12px; }
  body.hand #tip { font-size: 16px; padding: 6px 14px; }
  #savemenu { position: fixed; display: none; flex-direction: column; gap: 1px; padding: 8px 6px; min-width: 240px; border-radius: 14px; background: rgba(4, 16, 26, .86); box-shadow: 0 0 0 1px rgba(0, 212, 255, .25), 0 8px 30px rgba(0, 0, 0, .5); color: #bff4ff; font-size: 14px; z-index: 5; }
  #savemenu.open { display: flex; }
  body.hand #savemenu .cadui { font-size: 22px; padding: 10px 14px; }
  #dropring { position: absolute; left: 50%; top: 50%; width: calc(var(--mr) * 2); height: calc(var(--mr) * 2); transform: translate(-50%, -50%); border-radius: 50%; border: 2px dashed rgba(0, 212, 255, .8); box-shadow: 0 0 24px rgba(0, 212, 255, .45); opacity: 0; transition: opacity .15s; pointer-events: none; }
  body.dropping #dropring { opacity: 1; animation: pulse 1s ease-in-out infinite; }
  #tip { position: absolute; left: 0; top: 0; padding: 4px 10px; border-radius: 999px; background: rgba(4, 18, 28, .78); font-size: 12px; letter-spacing: .04em; white-space: nowrap; opacity: 0; transition: opacity .12s; pointer-events: none; color: #d9f8ff; }
  #tip.show { opacity: 1; }
  #err { position: absolute; left: 0; right: 0; top: 46%; text-align: center; color: #ffcc66; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage">
  <div id="merge" class="glow">Release to combine</div>
  <div id="hint2" class="glow"></div>
  <div id="err" class="glow"></div>
  <div id="ctl" class="glow">
    <div id="nav"><div class="btn" id="prev" hidden data-tip="Previous model">&#8249;</div><div id="opt" hidden></div><div class="btn" id="next" hidden data-tip="Next model">&#8250;</div></div>
    <div class="btn" id="more" data-tip="Menu">&#8943;</div>
    <div id="items">
      <div class="btn" id="move" data-name="Move" data-tip="Move: drag this to put it anywhere">&#10021;</div>
      <div class="btn" id="ask" data-name="Ask about it" data-tip="Ask about it (click a piece first to ask about just that piece)">?</div>
      <div class="btn" id="edit" hidden data-name="Edit shapes" data-tip="Edit the shapes: resize, move, add, remove, cut holes">&#9998;</div>
      <div class="btn" id="explode" data-name="Pull apart" data-tip="Pull it apart into pieces (or double-click it)">&#10070;</div>
      <div class="btn" id="reset" data-name="Turn to front" data-tip="Turn it back to the front">&#8982;</div>
      <div class="btn" id="upright" hidden data-name="Turn upright" data-tip="Turn it upright">&#8635;</div>
      <div class="btn" id="solid" data-name="Solid or light" data-tip="Switch between hologram and solid">&#9680;</div>
      <div class="btn" id="dragout" draggable="true" data-name="Drag to an app" data-tip="Drag this into Fusion, a slicer, a folder or a message: it is the model as a file">&#8689;</div>
      <div class="btn" id="measure" data-name="Measure" data-tip="Measure: click two points on the model to see the distance in millimetres">&#10231;</div>
      <div class="btn" id="realsize" data-name="Real size" data-tip="Real size: show it at life size on your screen, to check whether a part fits (calibrate your screen in Settings)">&#8596;</div>
      <div class="btn" id="printcheck" data-name="Print check" data-tip="Print check: is the skin closed, how much overhangs, how big it is in millimetres">&#9113;</div>
      <div class="btn" id="cut" data-name="Cut through it" data-tip="Slide a cutting plane through it to look inside">&#9704;</div>
      <div class="btn" id="save" data-name="Save / send to printer" data-tip="Save it (STL, 3MF, STEP) or send it to a printer app">&#10515;</div>
      <div class="btn" id="pin" data-name="Keep" data-tip="Keep it: stays when I say close, and after a restart">&#9906;</div>
      <div class="btn" id="close" data-name="Close" data-tip="Close just this one">&#10005;</div>
    </div>
  </div>
  <div id="cutbar" class="cadui glow"><div class="cutrow"><span class="cutlbl">Cut</span><span id="cutax"><b data-ax="0" title="Slide it left to right">&#8596;</b><b data-ax="1" class="on" title="Slide it up and down">&#8597;</b><b data-ax="2" title="Slide it front to back">&#9678;</b></span><b id="cutflip" class="cutb" title="Cut away the other side">&#8644;</b><b id="cutx" class="cutb" title="Close the cut">&#10005;</b></div><input id="cutr" type="range" min="-100" max="100" value="100"></div>
  <div id="dropring"></div>
  <div id="mlabel"></div>
  <div id="cap" class="glow"><div id="title" data-tip="Drag the name to move it anywhere"></div><div id="credit"></div></div>
</div>
<div id="cad"><div id="cadL" class="cadcol"></div><div id="cadR" class="cadcol"></div></div>
<div id="tip"></div>
<script type="module" src="holo.js"></script>
</body>
</html>
