<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
<style>
  /* The Recent menu: a glass panel on the left edge. The window itself carries the real blur of what is behind it
     (macOS vibrancy); this page adds the glass: a bright edge, a soft highlight that follows the pointer, and items that
     swell toward the pointer like a drop of water. */
  :root { --mx: 50%; --my: 0%; --ink: #f3f8fc; --dim: rgba(235, 245, 252, .62); --acc: #6fd3ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }
  .glass { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden;
    background:
      radial-gradient(260px 200px at var(--mx) var(--my), rgba(255, 255, 255, .20), rgba(255, 255, 255, 0) 70%),
      linear-gradient(165deg, rgba(255, 255, 255, .16) 0%, rgba(255, 255, 255, .05) 38%, rgba(10, 34, 56, .26) 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 0 0 1px rgba(255, 255, 255, .14), inset 0 -26px 46px rgba(0, 20, 40, .16); }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 20px 10px; }
  header h1 { font-size: 15px; font-weight: 650; letter-spacing: .01em; }
  header span { font-size: 11.5px; color: var(--dim); }
  #list { flex: 1; overflow-y: auto; padding: 4px 8px 14px; scrollbar-width: none; }
  #list::-webkit-scrollbar { display: none; }
  .item { position: relative; margin: 5px 4px; padding: 11px 14px 11px 16px; border-radius: 16px; cursor: pointer;
    background: linear-gradient(135deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .04));
    box-shadow: inset 0 .5px 0 rgba(255, 255, 255, .30), inset 0 0 0 .5px rgba(255, 255, 255, .10), 0 6px 16px rgba(0, 12, 28, .14);
    opacity: 0; transform: translateX(-26px) scale(.96);
    transition: transform .5s cubic-bezier(.3, 1.45, .5, 1), background .25s ease, box-shadow .25s ease, opacity .35s ease; transition-delay: calc(var(--i, 0) * 28ms), 0s, 0s, calc(var(--i, 0) * 28ms); }
  body.show .item { opacity: 1; transform: none; }
  body.show .item:hover { transform: translateX(5px) scale(1.025); transition-delay: 0s; background: linear-gradient(135deg, rgba(255, 255, 255, .21), rgba(255, 255, 255, .08));
    box-shadow: inset 0 .5px 0 rgba(255, 255, 255, .5), inset 0 0 0 .5px rgba(255, 255, 255, .2), 0 12px 26px rgba(0, 12, 28, .28); }
  body.show .item:active { transform: scale(.985); transition-duration: .12s; }
  .item::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 2px; background: var(--acc); opacity: .85; }
  .item.stopped::before { background: #ffb347; }
  .item.failed::before { background: #ff6b6b; }
  .q { padding-right: 30px; font-weight: 600; font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .a { margin-top: 3px; color: var(--dim); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .t { position: absolute; right: 12px; top: 10px; font-size: 10.5px; color: var(--dim); }
  .empty { padding: 36px 22px; color: var(--dim); text-align: center; }
  footer { padding: 10px 20px 16px; font-size: 11.5px; color: var(--dim); border-top: 1px solid rgba(255, 255, 255, .10); }
</style>
</head>
<body>
<div class="glass" id="glass">
  <header><h1>Recent</h1><span id="count"></span></header>
  <div id="list"></div>
  <footer>Click one to ask it again</footer>
</div>
<script src="recent.js"></script>
</body>
</html>
