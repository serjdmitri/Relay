<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
<style>
  /* The Recent menu: a liquid-glass panel joined to the left edge of the screen, level with the tab you rest the pointer on. It grows out of
     the tab and tucks back into it: it squashes, blurs and overshoots, with a bright rim and a sheen that sweeps across it. The panel's left side
     is square and touches the edge, with a brighter strip down it (the tab, kept) so it always looks attached. The window is transparent;
     everything you see is drawn here. */
  :root { --ink: #f4f7fa; --dim: rgba(240, 246, 252, .62); --acc: #6fd3ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }
  body { display: flex; align-items: center; padding-left: 0; }
  .panel { position: relative; width: 320px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; overflow: hidden; border-radius: 0 28px 28px 0;
    background:
      radial-gradient(260px 200px at 0% 0%, rgba(160, 225, 255, .30), rgba(160, 225, 255, 0) 70%),
      linear-gradient(160deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, .06) 38%, rgba(120, 190, 255, .10) 72%, rgba(255, 255, 255, .16)),
      rgba(16, 26, 38, .62);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .30), inset 0 1.5px 0 rgba(255, 255, 255, .55), inset -1px 0 0 rgba(255, 255, 255, .22), inset 0 -1px 0 rgba(255, 255, 255, .14), 0 18px 46px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .35), 0 0 28px rgba(111, 211, 255, .12);
    transform-origin: 0 50%; opacity: 0; pointer-events: none; transform: scale(.03, .4); filter: blur(10px); }
  body.show .panel { pointer-events: auto; animation: pop .36s cubic-bezier(.2, .9, .25, 1) forwards; }
  body.hide .panel { animation: tuck .26s cubic-bezier(.5, 0, .75, .4) forwards; }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.03, .4); filter: blur(10px); border-radius: 0 90px 90px 0; }
    40% { opacity: 1; transform: scale(1.05, 1.02); filter: blur(1.5px); border-radius: 0 34px 34px 0; }
    64% { transform: scale(.99, .997); filter: blur(0); }
    100% { opacity: 1; transform: none; filter: blur(0); border-radius: 0 28px 28px 0; }
  }
  @keyframes tuck {
    0% { opacity: 1; transform: none; filter: blur(0); border-radius: 0 28px 28px 0; }
    35% { opacity: 1; transform: scale(1.02, 1.01); filter: blur(1px); }
    100% { opacity: 0; transform: scale(.03, .4); filter: blur(10px); border-radius: 0 90px 90px 0; }
  }
  /* the tab, kept: a bright glass strip down the edge so the panel reads as joined to the side of the screen */
  .joint { position: absolute; left: 0; top: 0; bottom: 0; width: 7px; pointer-events: none; background: linear-gradient(90deg, rgba(255, 255, 255, .62), rgba(255, 255, 255, .20) 60%, rgba(255, 255, 255, .06)); box-shadow: inset -1px 0 0 rgba(255, 255, 255, .30); }
  .sheen { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; opacity: 0;
    background: linear-gradient(105deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, .20) 46%, rgba(255, 255, 255, 0) 62%); transform: translateX(-100%); }
  body.show .sheen { animation: sweep .6s .05s ease-out forwards; }
  @keyframes sweep { 0% { opacity: 1; transform: translateX(-100%); } 100% { opacity: 0; transform: translateX(100%); } }
  .rim { position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: radial-gradient(220px 160px at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, .18), rgba(255, 255, 255, 0) 70%); }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 22px 8px 30px; }
  header h1 { font-size: 14px; font-weight: 650; letter-spacing: .02em; }
  header span { font-size: 11.5px; color: var(--dim); }
  #list { overflow-y: auto; padding: 4px 10px 12px 18px; scrollbar-width: none; }
  #list::-webkit-scrollbar { display: none; }
  .item { position: relative; margin: 4px 0; padding: 10px 14px 10px 16px; border-radius: 18px; cursor: pointer; background: rgba(255, 255, 255, .10);
    box-shadow: inset 0 .5px 0 rgba(255, 255, 255, .26), inset 0 0 0 .5px rgba(255, 255, 255, .12);
    opacity: 0; transform: translateX(-16px); transition: transform .45s cubic-bezier(.3, 1.4, .5, 1), background .2s ease, opacity .3s ease; transition-delay: calc(var(--i, 0) * 14ms + 50ms), 0s, calc(var(--i, 0) * 14ms + 50ms); }
  body.show .item { opacity: 1; transform: none; }
  body.show .item:hover { transform: translateX(4px) scale(1.02); transition-delay: 0s; background: rgba(255, 255, 255, .20); }
  body.show .item:active { transform: scale(.985); transition-duration: .1s; }
  .item::before { content: ""; position: absolute; left: 0; top: 13px; bottom: 13px; width: 3px; border-radius: 2px; background: var(--acc); }
  .item.stopped::before { background: #ffb347; }
  .item.failed::before { background: #ff6b6b; }
  .q { padding-right: 30px; font-weight: 600; font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .a { margin-top: 3px; color: var(--dim); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .t { position: absolute; right: 12px; top: 10px; font-size: 10.5px; color: var(--dim); }
  .empty { padding: 30px 22px 34px; color: var(--dim); text-align: center; }
  footer { padding: 9px 22px 15px 30px; font-size: 11.5px; color: var(--dim); }
</style>
</head>
<body>
<div class="panel" id="glass">
  <div class="rim"></div><div class="sheen"></div><div class="joint"></div>
  <header><h1>Recent</h1><span id="count"></span></header>
  <div id="list"></div>
  <footer>Click one to ask it again</footer>
</div>
<script src="recent.js"></script>
</body>
</html>
