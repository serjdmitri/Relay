<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
<style>
  /* The Recent menu: a liquid-glass panel joined to the left edge of the screen, level with the tab you rest the pointer on. It grows out of
     the tab and tucks back into it: it squashes, blurs and overshoots, with a bright rim and a sheen that sweeps across it. The panel's left side
     is square and touches the edge, with a brighter strip down it (the tab, kept) so it always looks attached. The window is transparent;
     everything you see is drawn here. */
  :root { --ink: #f4f7fa; --dim: rgba(240, 246, 252, .62); --acc: #6fd3ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }
  body { display: flex; align-items: center; padding-left: 0; }
  /* One shape: the glass panel and the two curved flares that sweep it into the screen edge (like the notch's inward corners) are cut from a single
     piece of glass with a clip-path, so the colour is the same all the way and there are no seams or extra lines. .wrap carries the animation,
     .lift the shadow, #glass the glass and its content; the page script draws the clip and the faint outline for the current size. */
  .wrap { position: relative; width: 320px; transform-origin: 0 50%; opacity: 0; pointer-events: none; transform: scale(.03, .4); filter: blur(10px); }
  body.show .wrap { pointer-events: auto; animation: pop .36s cubic-bezier(.2, .9, .25, 1) forwards; }
  body.hide .wrap { animation: tuck .26s cubic-bezier(.5, 0, .75, .4) forwards; }
  .lift { position: relative; filter: drop-shadow(0 14px 30px rgba(0, 0, 0, .42)) drop-shadow(0 2px 5px rgba(0, 0, 0, .3)); }
  #glass { position: relative; width: 100%; max-height: calc(100vh - 56px); padding: 22px 0; display: flex; flex-direction: column; overflow: hidden;
    /* clear, glossy glass: very little tint (a touch darker where it touches the screen edge, so it reads as attached), a bright specular band along the
       top, a diagonal sheen, a soft glow along the bottom. It does not blur what is behind it: a transparent window cannot. */
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .36) 0, rgba(255, 255, 255, .12) 12%, rgba(255, 255, 255, 0) 32%),
      linear-gradient(115deg, rgba(255, 255, 255, 0) 28%, rgba(255, 255, 255, .15) 43%, rgba(255, 255, 255, .03) 52%, rgba(255, 255, 255, 0) 60%),
      linear-gradient(0deg, rgba(150, 210, 255, .16) 0, rgba(150, 210, 255, 0) 28%),
      linear-gradient(90deg, rgba(8, 14, 22, .46) 0, rgba(8, 14, 22, .24) 40%, rgba(8, 14, 22, .14) 100%); }
  #glass header h1, #glass .item .q, #glass .item .a, #glass .item .t, #glass footer, #glass header span { text-shadow: 0 1px 5px rgba(0, 0, 0, .55); }
  #outline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #outline path { fill: none; stroke: url(#og); stroke-width: 1.2; }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.03, .4); filter: blur(10px); }
    40% { opacity: 1; transform: scale(1.05, 1.02); filter: blur(1.5px); }
    64% { transform: scale(.99, .997); filter: blur(0); }
    100% { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes tuck {
    0% { opacity: 1; transform: none; filter: blur(0); }
    35% { opacity: 1; transform: scale(1.02, 1.01); filter: blur(1px); }
    100% { opacity: 0; transform: scale(.03, .4); filter: blur(10px); }
  }
  .sheen { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; opacity: 0;
    background: linear-gradient(105deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, .20) 46%, rgba(255, 255, 255, 0) 62%); transform: translateX(-100%); }
  body.show .sheen { animation: sweep .6s .05s ease-out forwards; }
  @keyframes sweep { 0% { opacity: 1; transform: translateX(-100%); } 100% { opacity: 0; transform: translateX(100%); } }
  .rim { position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: radial-gradient(220px 160px at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, .13), rgba(255, 255, 255, 0) 70%); }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 22px 8px 30px; }
  header h1 { font-size: 14px; font-weight: 650; letter-spacing: .02em; }
  header span { font-size: 11.5px; color: var(--dim); }
  #list { overflow-y: auto; padding: 4px 10px 12px 18px; scrollbar-width: none; }
  #list::-webkit-scrollbar { display: none; }
  .item { position: relative; margin: 4px 0; padding: 10px 14px 10px 16px; border-radius: 18px; cursor: pointer; background: linear-gradient(180deg, rgba(255, 255, 255, .20), rgba(255, 255, 255, .07));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .42), inset 0 0 0 .5px rgba(255, 255, 255, .16);
    opacity: 0; transform: translateX(-16px); transition: transform .45s cubic-bezier(.3, 1.4, .5, 1), background .2s ease, opacity .3s ease; transition-delay: calc(var(--i, 0) * 14ms + 50ms), 0s, calc(var(--i, 0) * 14ms + 50ms); }
  body.show .item { opacity: 1; transform: none; }
  body.show .item:hover { transform: translateX(4px) scale(1.02); transition-delay: 0s; background: linear-gradient(180deg, rgba(255, 255, 255, .30), rgba(255, 255, 255, .12)); }
  body.show .item:active { transform: scale(.985); transition-duration: .1s; }
  .item::before { content: ""; position: absolute; left: 0; top: 13px; bottom: 13px; width: 3px; border-radius: 2px; background: var(--acc); }
  .item.stopped::before { background: #ffb347; }
  .item.failed::before { background: #ff6b6b; }
  .q { padding-right: 30px; font-weight: 600; font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .a { margin-top: 3px; color: var(--dim); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .t { position: absolute; right: 12px; top: 10px; font-size: 10.5px; color: var(--dim); }
  .empty { padding: 30px 22px 34px; color: var(--dim); text-align: center; }
  footer { padding: 9px 22px 15px 30px; font-size: 11.5px; color: var(--dim); }
/* Dark Recent panel matching the reference: quiet black surface and rounded rows. */
#glass { background: #050505; }
#outline { display: none; }
.sheen, .rim { display: none; }
.item { background: #151515; box-shadow: inset 0 0 0 1px #303030; }
body.show .item:hover { background: #202020; }
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="lift">
<div id="glass">
  <div class="rim"></div><div class="sheen"></div>
  <header><h1>Recent</h1><span id="count"></span></header>
  <div id="list"></div>
  <footer>Click one to ask it again</footer>
</div>
<svg id="outline"><defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".45" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/></linearGradient></defs><path id="outpath"/></svg>
</div></div>
<script src="recent.js"></script>
</body>
</html>
