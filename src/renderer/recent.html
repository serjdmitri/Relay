<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
<style>
  /* The Recent menu: a black panel centered on the left edge like a Dock, the same black as the notch. It pops out of the
     edge and goes back in like a drop of liquid glass: it squashes, blurs and overshoots, with a bright rim and a sheen
     that sweeps across it. The window is transparent; everything you see is drawn here. */
  :root { --ink: #f4f7fa; --dim: rgba(240, 246, 252, .56); --acc: #6fd3ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }
  body { display: flex; align-items: center; padding-left: 8px; }
  .panel { position: relative; width: 320px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; overflow: hidden; background: #000; border-radius: 28px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16), inset 0 1px 0 rgba(255, 255, 255, .34), 0 18px 46px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .5);
    transform-origin: 0 50%; opacity: 0; pointer-events: none; transform: translateX(-60px) scale(.2, .55); filter: blur(14px); }
  body.show .panel { pointer-events: auto; animation: pop .34s cubic-bezier(.2, .9, .25, 1) forwards; }
  body.hide .panel { animation: tuck .26s cubic-bezier(.5, 0, .75, .4) forwards; }
  @keyframes pop {
    0% { opacity: 0; transform: translateX(-60px) scale(.2, .55); filter: blur(14px); border-radius: 80px; }
    38% { opacity: 1; transform: translateX(6px) scale(1.07, 1.03); filter: blur(2px); border-radius: 34px; }
    62% { transform: translateX(-2px) scale(.985, .995); filter: blur(0); }
    100% { opacity: 1; transform: none; filter: blur(0); border-radius: 28px; }
  }
  @keyframes tuck {
    0% { opacity: 1; transform: none; filter: blur(0); border-radius: 28px; }
    35% { opacity: 1; transform: translateX(6px) scale(1.03, 1.02); filter: blur(1px); }
    100% { opacity: 0; transform: translateX(-64px) scale(.16, .5); filter: blur(14px); border-radius: 90px; }
  }
  .sheen { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; opacity: 0;
    background: linear-gradient(105deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, .13) 46%, rgba(255, 255, 255, 0) 62%); transform: translateX(-100%); }
  body.show .sheen { animation: sweep .6s .05s ease-out forwards; }
  @keyframes sweep { 0% { opacity: 1; transform: translateX(-100%); } 100% { opacity: 0; transform: translateX(100%); } }
  .rim { position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: radial-gradient(220px 160px at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, .13), rgba(255, 255, 255, 0) 70%); }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 22px 8px; }
  header h1 { font-size: 14px; font-weight: 650; letter-spacing: .02em; }
  header span { font-size: 11.5px; color: var(--dim); }
  #list { overflow-y: auto; padding: 4px 10px 12px; scrollbar-width: none; }
  #list::-webkit-scrollbar { display: none; }
  .item { position: relative; margin: 4px 0; padding: 10px 14px 10px 16px; border-radius: 18px; cursor: pointer; background: rgba(255, 255, 255, .06);
    box-shadow: inset 0 .5px 0 rgba(255, 255, 255, .16), inset 0 0 0 .5px rgba(255, 255, 255, .07);
    opacity: 0; transform: translateX(-16px); transition: transform .45s cubic-bezier(.3, 1.4, .5, 1), background .2s ease, opacity .3s ease; transition-delay: calc(var(--i, 0) * 14ms + 50ms), 0s, calc(var(--i, 0) * 14ms + 50ms); }
  body.show .item { opacity: 1; transform: none; }
  body.show .item:hover { transform: translateX(4px) scale(1.02); transition-delay: 0s; background: rgba(255, 255, 255, .13); }
  body.show .item:active { transform: scale(.985); transition-duration: .1s; }
  .item::before { content: ""; position: absolute; left: 0; top: 13px; bottom: 13px; width: 3px; border-radius: 2px; background: var(--acc); }
  .item.stopped::before { background: #ffb347; }
  .item.failed::before { background: #ff6b6b; }
  .q { padding-right: 30px; font-weight: 600; font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .a { margin-top: 3px; color: var(--dim); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .t { position: absolute; right: 12px; top: 10px; font-size: 10.5px; color: var(--dim); }
  .empty { padding: 30px 22px 34px; color: var(--dim); text-align: center; }
  footer { padding: 9px 22px 15px; font-size: 11.5px; color: var(--dim); }
</style>
</head>
<body>
<div class="panel" id="glass">
  <div class="rim"></div><div class="sheen"></div>
  <header><h1>Recent</h1><span id="count"></span></header>
  <div id="list"></div>
  <footer>Click one to ask it again</footer>
</div>
<script src="recent.js"></script>
</body>
</html>
