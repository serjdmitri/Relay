<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; width: 100vw; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  /* the halo: where Relay is about to click or wants to point */
  #cur { position: absolute; left: 0; top: 0; width: 0; height: 0; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .25s; transform: translate(-100px, -100px); opacity: 0; }
  #cur.on { opacity: 1; }
  #halo { position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle, rgba(122,107,255,.55) 0%, rgba(108,99,255,.25) 55%, rgba(108,99,255,0) 72%); }
  #ring { position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid #8f86ff; box-shadow: 0 0 14px #6c63ff; animation: pulse 1.1s ease-out infinite; }
  #dot { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  #lab { position: absolute; left: 24px; top: 14px; background: #1d1d22; color: #fff; font: 500 13px -apple-system, system-ui, sans-serif; padding: 5px 10px; border-radius: 10px; border: 1px solid #3a3a42; white-space: nowrap; display: none; }
  @keyframes pulse { 0% { transform: scale(.8); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }

  /* the buddy: follows the real pointer */
  #buddy { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; transition: opacity .25s; will-change: transform; }
  #buddy.on { opacity: 1; }
  .orb { position: absolute; left: -10px; top: -10px; width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.75), rgba(255,255,255,0) 38%), linear-gradient(135deg, #6c63ff, #c13cf0 62%, #ff8a3d);
    box-shadow: 0 3px 10px rgba(108,99,255,.5), 0 0 0 1.5px rgba(255,255,255,.9); transition: background .3s; }
  .bars { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; gap: 1.5px; }
  .bars i { width: 2px; height: 5px; border-radius: 2px; background: #fff; animation: eq .8s ease-in-out infinite; }
  .bars i:nth-child(2) { animation-delay: .15s; } .bars i:nth-child(3) { animation-delay: .3s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 10px; } }
  .spin { position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 2.5px solid transparent; border-top-color: rgba(255,255,255,.95); display: none; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .chk { position: absolute; left: -10px; top: -10px; width: 20px; height: 20px; display: none; }
  #buddy.listening .bars { display: flex; }
  #buddy.thinking .spin { display: block; }
  #buddy.done .orb { background: linear-gradient(135deg, #34c759, #2fc4ff); }
  #buddy.done .chk { display: block; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* drawings */
  #draw { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
  #draw .shape { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: dash .55s ease-out forwards; }
  #draw .under { stroke: rgba(255,255,255,.92); stroke-width: 8; }
  #draw .over { stroke: #6c63ff; stroke-width: 4.5; }
  #draw .fill { fill: rgba(108,99,255,.13); stroke: none; stroke-dasharray: none; stroke-dashoffset: 0; animation: fade .4s ease-out forwards; opacity: 0; }
  @keyframes dash { to { stroke-dashoffset: 0; } }
  @keyframes fade { to { opacity: 1; } }
  #labels .tag { position: absolute; background: #1d1d22; color: #fff; font: 600 14px -apple-system, system-ui, sans-serif; padding: 6px 12px; border-radius: 12px; border: 2px solid #6c63ff; box-shadow: 0 6px 18px rgba(0,0,0,.35); white-space: nowrap; max-width: 420px; overflow: hidden; text-overflow: ellipsis; animation: pop .3s cubic-bezier(.2,1.4,.4,1) both; }
  #labels .big { font-size: 20px; padding: 8px 16px; border-radius: 14px; }

  /* the guide card */
  #card { position: absolute; top: 56px; right: 20px; width: 340px; padding: 14px 16px 12px; border-radius: 18px; color: #f4f3ff; background: rgba(24,22,44,.92); border: 1px solid rgba(255,255,255,.16); box-shadow: 0 18px 48px rgba(0,0,0,.45); display: none; }
  #card.left { right: auto; left: 20px; }
  #card.on { display: block; animation: pop .3s cubic-bezier(.2,1.2,.4,1) both; }
  #card .head { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #a9a5d6; margin-bottom: 8px; display: flex; justify-content: space-between; }
  #card .step { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 14px; line-height: 1.3; color: #bdb9e8; }
  #card .n { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: rgba(255,255,255,.12); color: #fff; }
  #card .step.now { color: #fff; font-weight: 600; }
  #card .step.now .n { background: linear-gradient(135deg, #6c63ff, #c13cf0); box-shadow: 0 0 12px rgba(108,99,255,.7); }
  #card .step.done { opacity: .5; text-decoration: line-through; }
  #card .step.done .n { background: #34c759; }
  #card .foot { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.12); font-size: 12px; color: #a9a5d6; }

  /* ===== Jarvis look: one cyan accent. The buddy is a small ring with a cursor triangle; the pen traces what Relay draws. ===== */
  :root { --mk: #6c63ff; --cy: #4cc2ff; --cy2: #9fdcff; --ink: #06121b; }
  #reticle, #ring2, #ptr, #pen { display: none; }
  .jarvis .orb, .jarvis .spin, .jarvis .chk { display: none !important; }
  .jarvis #reticle { display: block; position: absolute; left: -18px; top: -18px; width: 36px; height: 36px; overflow: visible; filter: drop-shadow(0 1px 2px rgba(0,0,0,.55)); }
  .jarvis #ptr { display: block; position: absolute; left: -17px; top: -18px; width: 15px; height: 15px; overflow: visible; filter: drop-shadow(0 1px 2px rgba(0,0,0,.55)); }
  #ptr path, #pen path { fill: var(--cy); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
  #reticle g { transform-box: fill-box; transform-origin: center; }
  #reticle circle { fill: none; stroke: var(--cy); }
  #reticle .a { stroke-width: 1.4; stroke-dasharray: 70 10 28 10 14 10; animation: rot 14s linear infinite; }
  #reticle .b { stroke-width: 5; stroke-dasharray: 58 23.7; opacity: .95; animation: rot 9s linear infinite reverse; }
  #reticle .t { display: none; }
  #reticle .c { stroke-width: 3.2; stroke: var(--cy2); stroke-dasharray: 118 33; animation: rot 6s linear infinite reverse; }
  #reticle .core { fill: rgba(76, 194, 255, .2); stroke: none; }
  #reticle .dot { fill: #fff; stroke: none; }
  #reticle .ok { fill: none; stroke: var(--cy2); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  @keyframes rot { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.14); opacity: 1; } }
  #buddy.listening #reticle .c { animation: breathe .55s ease-in-out infinite; stroke-dasharray: none; }
  #buddy.listening #reticle .core { animation: breathe .55s ease-in-out infinite; }
  #buddy.thinking #reticle .a { animation-duration: 3s; }
  #buddy.thinking #reticle .b { animation-duration: 1.6s; }
  #buddy.thinking #reticle .c { animation-duration: 1.1s; }
  #buddy.done #reticle .a, #buddy.done #reticle .b, #buddy.done #reticle .core, #buddy.done #reticle .dot { opacity: 0; transition: opacity .25s; }
  #buddy.done #reticle .c { stroke: var(--cy2); stroke-dasharray: none; animation: breathe .4s ease-out 1; }
  #buddy.done #reticle .ok { opacity: 1; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  /* the pen: a cursor triangle that moves along each stroke as it is drawn */
  .jarvis { --mk: #4cc2ff; }
  #markLayer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  #markLayer polyline { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #markLayer .u { stroke: rgba(4, 12, 20, .8); stroke-width: 8; }
  #markLayer .o { stroke: var(--mk); stroke-width: 3.2; }
  .jarvis #pen { display: block; position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; transition: opacity .25s; will-change: transform; }
  .jarvis #pen.on { opacity: 1; }
  #pen svg { position: absolute; left: -1px; top: -1px; width: 17px; height: 17px; overflow: visible; filter: drop-shadow(0 1px 2px rgba(0,0,0,.55)); }
  .jarvis #ring { border: 1.5px solid var(--cy); box-shadow: none; }
  .jarvis #halo { background: radial-gradient(circle, rgba(76,194,255,.30) 0%, rgba(76,194,255,.12) 55%, rgba(76,194,255,0) 72%); }
  .jarvis #dot { background: var(--cy2); box-shadow: none; }
  .jarvis #ring2 { display: block; position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; border-radius: 50%; border: 1.5px dashed rgba(76,194,255,.75); animation: rot 7s linear infinite; }
  .jarvis #lab, .jarvis #labels .tag { background: rgba(8, 18, 27, .94); color: #eaf6fd; border: 1px solid rgba(76,194,255,.55); border-radius: 8px; font: 600 13px -apple-system, system-ui, sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .jarvis #labels .big { font-size: 17px; }
  .jarvis #draw .under { stroke: rgba(4, 12, 20, .8); stroke-width: 8; }
  .jarvis #draw .over { stroke: var(--cy); stroke-width: 3.2; }
  .jarvis #draw .fill { fill: rgba(76, 194, 255, .09); }
  .jarvis #card { width: 330px; padding: 14px 16px 12px; border-radius: 14px; color: #eaf6fd; background: rgba(11, 17, 24, .94); border: 1px solid rgba(76,194,255,.3); box-shadow: 0 14px 36px rgba(0,0,0,.45); }
  .jarvis #card .head { color: var(--cy); letter-spacing: .08em; }
  .jarvis #card .step { color: #8fa7b8; }
  .jarvis #card .n { background: rgba(255,255,255,.08); color: #d7e9f5; }
  .jarvis #card .step.now { color: #fff; }
  .jarvis #card .step.now .n { background: #1c8fd6; color: #fff; box-shadow: none; }
  .jarvis #card .step.done .n { background: rgba(76,194,255,.25); color: var(--cy2); }
  .jarvis #card .foot { color: #6f8aa0; border-top-color: rgba(255,255,255,.1); }
  #card .prog { display: none; }
  .jarvis #card .prog { display: flex; gap: 3px; margin: 0 0 10px; }
  .jarvis #card .prog i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.1); }
  .jarvis #card .prog i.on { background: var(--cy); }
  .jarvis #card .prog i.now { background: var(--cy); animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
</style>
</head>
<body>
<svg id="draw" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="markLayer" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="labels"></div>
<div id="cur"><div id="halo"></div><div id="ring2"></div><div id="ring"></div><div id="dot"></div><div id="lab"></div></div>
<div id="buddy"><svg id="ptr" viewBox="0 0 15 15" aria-hidden="true"><path d="M1.2 1.2 L13.4 5.6 L7.9 7.9 L5.6 13.4 Z"/></svg><svg id="reticle" viewBox="-50 -50 100 100" aria-hidden="true"><g class="a"><circle r="47"/></g><g class="b"><circle r="39"/></g><g class="t"><circle r="32"/></g><g class="c"><circle r="24"/></g><circle class="core" r="14"/><circle class="dot" r="3"/><path class="ok" d="M-9 1 l6.5 6.5 l12 -13"/></svg><div class="spin"></div><div class="orb"><div class="bars"><i></i><i></i><i></i></div></div>
  <svg class="chk" viewBox="0 0 30 30"><path d="M8.5 15.5l4.2 4.2 8.8-9.4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div id="pen"><svg viewBox="0 0 15 15" aria-hidden="true"><path d="M1.2 1.2 L13.4 5.6 L7.9 7.9 L5.6 13.4 Z"/></svg></div>
<div id="card"></div>
<script src="overlay.js"></script>
</body>
</html>
