<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
<style>
  :root { --ink: #f4f7fa; --dim: rgba(240, 246, 252, .58); --acc: #6fd3ff; --ok: #5be584; --warn: #ffb347; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none; }
  #stack { display: flex; flex-direction: column; gap: 8px; padding: 6px 8px; }
  .status { align-self: flex-end; background: #000; border-radius: 99px; padding: 5px 12px; font-size: 11.5px; color: var(--dim); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16); display: flex; gap: 7px; align-items: center; }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .a { background: #000; border-radius: 20px; padding: 12px 16px 12px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16), inset 0 1px 0 rgba(255, 255, 255, .3), 0 10px 30px rgba(0, 0, 0, .5); animation: in .22s cubic-bezier(.2, .9, .25, 1); transition: opacity .3s; }
  .a.old { opacity: .45; }
  @keyframes in { from { opacity: 0; transform: translateY(-8px) scale(.97); } }
  .q { color: var(--dim); font-size: 11.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ans { margin-top: 6px; font-size: 15px; font-weight: 600; line-height: 1.35; }
  .ans:empty { display: none; }
  ul { margin-top: 6px; padding-left: 16px; color: rgba(240, 246, 252, .86); font-size: 12.5px; }
  li { margin-top: 2px; }
  .foot { margin-top: 8px; font-size: 11.5px; color: var(--dim); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .foot b { font-weight: 600; }
  .ok b { color: var(--ok); } .fix b { color: var(--warn); }
  .fix .extra { color: var(--ink); font-size: 12.5px; flex-basis: 100%; }
  .dots span { display: inline-block; width: 5px; height: 5px; margin-right: 3px; border-radius: 50%; background: var(--acc); animation: dot 1s infinite; }
  .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 50% { transform: translateY(-3px); opacity: .4; } }
  .test { background: #000; border-radius: 20px; padding: 20px; text-align: center; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2); }
  .test h1 { font-size: 26px; letter-spacing: .04em; color: var(--warn); }
  .test p { margin-top: 8px; color: var(--dim); }
</style>
</head>
<body>
<div id="stack"></div>
<script src="assist.js"></script>
</body>
</html>
