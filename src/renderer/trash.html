<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'"><style>
:root{--trash-blue:#00d4ff;--trash-red:#ff5571;--trash-ink:#e6f7ff;--radius:76px}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font:12px system-ui;color:var(--trash-ink)}
