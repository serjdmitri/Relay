<!doctype html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Camera</title>

<!-- The live camera picture, drawn here on this Mac. Nothing is saved or sent; Jarvis can take one picture of it when you ask what it sees. -->

<main><video id="v" autoplay muted playsinline></video><p id="msg" role="status">Starting the camera…</p></main>

</body>
