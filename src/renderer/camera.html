<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'">
<title>Camera</title>
<link rel="stylesheet" href="camera.css">
</head>
<body>
<!-- The live camera picture, drawn here on this Mac with its edges faded into the screen. Boxes and names come from a small object finder that also runs here. Nothing is saved or sent. -->
<div id="view"><video id="v" autoplay muted playsinline></video><canvas id="boxes"></canvas></div>
<button id="x" type="button" aria-label="Close the camera">×</button>
<div id="bar" role="toolbar" aria-label="Camera controls"><button id="b-boxes" type="button" aria-pressed="false">Boxes</button><button id="b-people" type="button" aria-pressed="false">People only</button><button id="b-cam" type="button" title="Switch to the next camera">Camera</button><button id="b-close" type="button">Close</button></div>
<p id="msg" role="status">Starting the camera…</p>
<script type="module" src="camera.js"></script>
</body>
</html>
