<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* The thin tab that sticks out of the left edge so you know the Recent menu is there. Rest the pointer on it to open the menu.
     Liquid glass: pale and see-through with a bright rim. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  .tab { position: absolute; left: -1px; top: 8px; bottom: 8px; width: 8px; border-radius: 0 6px 6px 0;
    background: linear-gradient(90deg, rgba(255, 255, 255, .55), rgba(190, 230, 255, .30) 70%, rgba(255, 255, 255, .16));
    box-shadow: inset -1px 0 0 rgba(255, 255, 255, .55), inset 0 1px 0 rgba(255, 255, 255, .5), inset 0 -1px 0 rgba(255, 255, 255, .25), 0 0 0 .5px rgba(255, 255, 255, .2), 2px 0 10px rgba(0, 0, 0, .35), 0 0 12px rgba(111, 211, 255, .25);
    transition: transform .26s cubic-bezier(.3, 1.3, .5, 1), opacity .2s ease; }
  .tab::after { content: ""; position: absolute; left: 2px; top: 50%; width: 2px; height: 36px; margin-top: -18px; border-radius: 1px; background: rgba(255, 255, 255, .8); }
  body.away .tab { transform: translateX(-10px); opacity: 0; }
  body.hello .tab { animation: hello 1.3s ease .2s 2; }
  @keyframes hello { 0%, 100% { transform: none; } 40% { transform: translateX(4px); } }
</style>
</head>
<body class="hello"><div class="tab"></div>
<script>
  window.addEventListener('message', (e) => document.body.classList.toggle('away', e.data === 'away'));
  window.__away = (on) => document.body.classList.toggle('away', !!on);
</script>
</body>
</html>
