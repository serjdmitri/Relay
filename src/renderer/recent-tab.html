<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* The tab that sticks out of the left edge so you know the Recent menu is there. Black like the notch, with a bright rim. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  .tab { position: absolute; left: -2px; top: 12px; width: 16px; height: 96px; border-radius: 0 10px 10px 0; background: #000;
    box-shadow: inset -1px 0 0 rgba(255, 255, 255, .26), inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 -1px 0 rgba(255, 255, 255, .12), 0 0 0 .5px rgba(255, 255, 255, .12), 4px 0 14px rgba(0, 0, 0, .45);
    transition: transform .26s cubic-bezier(.3, 1.3, .5, 1), opacity .2s ease; }
  .tab::after { content: ""; position: absolute; left: 6px; top: 50%; width: 3px; height: 26px; margin-top: -13px; border-radius: 2px; background: rgba(255, 255, 255, .42); }
  body.away .tab { transform: translateX(-18px); opacity: 0; }
  body.hello .tab { animation: hello 1.3s ease .2s 2; }
  @keyframes hello { 0%, 100% { transform: none; } 40% { transform: translateX(7px); } }
</style>
</head>
<body class="hello"><div class="tab"></div>
<script>
  window.addEventListener('message', (e) => document.body.classList.toggle('away', e.data === 'away'));
  window.__away = (on) => document.body.classList.toggle('away', !!on);
</script>
</body>
</html>
