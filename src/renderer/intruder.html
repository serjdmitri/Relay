<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:; media-src 'none'">
<title>Access denied</title>
<link rel="stylesheet" href="intruder.css">
</head>
<body class="alarm">
<!-- Two screens over a blurred desktop, one reactor: ALARM (red: a face that is not yours is here, with a countdown to the lock) and AWAY (blue: you stepped away, standing by until you are back). -->
<main id="wrap" role="alert" aria-live="assertive">
  <canvas id="reactor" aria-hidden="true"></canvas>
  <h1 id="line1">THIS IS NOT YOUR COMPUTER</h1>
  <h2 id="line2">ACCESS DENIED</h2>
  <p id="count" aria-live="off"></p>
  <p id="note"></p>
  <button id="touch" type="button" hidden aria-label="Stop with Touch ID">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <path d="M21 10.5C24.5 8.5 28 8 32 8c11 0 21 7 21 20"/><path d="M32 10c-12 0-21 9-21 21v6"/><path d="M32 16c-8.8 0-15 6.2-15 15v8c0 4-1 7-3 10"/>
      <path d="M32 22c-5.5 0-9 3.7-9 9v7c0 6-2 10-5 14"/><path d="M32 28c-2.2 0-3 1.6-3 3.5v6c0 7-2 12-6 16"/><path d="M38 24c3 1.5 5 4 5 8v6c0 8-3 14-8 19"/>
      <path d="M32 34v4c0 7-1.5 12-5 17"/><path d="M44 20c4 3 6 7 6 12v5c0 5-1 9-3 13"/><path d="M52 29v8c0 3-.4 6-1 8"/>
    </svg>
    <span id="touchlabel">Touch ID to stop</span>
  </button>
</main>
<script src="intruder.js"></script>
</body>
</html>
