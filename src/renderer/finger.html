<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>Hologram</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; width: 100vw; height: 100vh; }
  #holo { position: absolute; inset: 0; opacity: 0; transform: translateY(18px) scale(.86); transition: opacity .28s ease, transform .38s cubic-bezier(.2, 1.2, .3, 1); }
  body.on #holo { opacity: 1; transform: none; }
  svg { position: absolute; left: 20px; top: 0; width: 200px; height: 300px; overflow: visible; filter: drop-shadow(0 0 7px rgba(76, 214, 255, .95)) drop-shadow(0 0 22px rgba(0, 160, 255, .7)); animation: flicker 2.6s steps(1) infinite; }
  .shape { fill: rgba(60, 200, 255, .1); stroke: #7fe4ff; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .line { fill: none; stroke: rgba(150, 235, 255, .75); stroke-width: 1.4; stroke-linecap: round; }
  .scan { position: absolute; left: 20px; top: 0; width: 200px; height: 300px; pointer-events: none; mix-blend-mode: screen;
    background: repeating-linear-gradient(0deg, rgba(120, 225, 255, .0) 0 3px, rgba(120, 225, 255, .22) 3px 4px);
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 300'><rect x='86' y='20' width='32' height='150' rx='16'/><rect x='40' y='128' width='128' height='134' rx='36'/></svg>"); -webkit-mask-size: 100% 100%; }
  .sweep { position: absolute; left: 20px; top: 0; width: 200px; height: 300px; pointer-events: none; overflow: hidden; border-radius: 40px; }
  .sweep::after { content: ""; position: absolute; left: 0; right: 0; height: 46px; top: -46px; background: linear-gradient(180deg, rgba(160, 240, 255, 0), rgba(160, 240, 255, .55), rgba(160, 240, 255, 0)); animation: sweep 1.9s linear infinite; }
  .base { position: absolute; left: 30px; top: 288px; width: 180px; height: 44px; border-radius: 50%; border: 2px solid rgba(110, 225, 255, .8); background: radial-gradient(ellipse at center, rgba(60, 200, 255, .45), rgba(60, 200, 255, 0) 70%); box-shadow: 0 0 22px rgba(60, 200, 255, .8); animation: ring 2.2s ease-in-out infinite; }
  .beam { position: absolute; left: 44px; top: 160px; width: 152px; height: 150px; background: linear-gradient(180deg, rgba(60, 200, 255, 0), rgba(60, 200, 255, .16)); clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%); }
  @keyframes sweep { from { transform: translateY(0); } to { transform: translateY(350px); } }
  @keyframes ring { 0%, 100% { opacity: .85; transform: scale(1); } 50% { opacity: .55; transform: scale(1.05); } }
  @keyframes flicker { 0%, 100% { opacity: 1; } 8% { opacity: .78; } 9% { opacity: 1; } 47% { opacity: 1; } 48% { opacity: .7; } 50% { opacity: 1; } 83% { opacity: .85; } 85% { opacity: 1; } }
</style>
</head>
<body>
<div id="holo">
  <div class="beam"></div>
  <div class="base"></div>
  <svg viewBox="0 0 200 300" aria-hidden="true">
    <!-- a fist seen from the front with the middle finger up: the middle finger, the folded fingers, the palm, the thumb across them -->
    <rect class="shape" x="86" y="20" width="32" height="150" rx="16"/>
    <path class="line" d="M92 52 q10 -9 20 0"/>
    <rect class="shape" x="44" y="132" width="40" height="52" rx="20"/>
    <rect class="shape" x="120" y="132" width="36" height="50" rx="18"/>
    <rect class="shape" x="154" y="146" width="28" height="42" rx="14"/>
    <rect class="shape" x="40" y="150" width="138" height="112" rx="38"/>
    <path class="shape" d="M30 214 C14 200 24 176 46 186 L92 214 C104 224 98 244 82 240 Z"/>
    <path class="line" d="M64 150 v30 M100 168 v14 M140 150 v28 M60 214 h70 M70 236 h60"/>
  </svg>
  <div class="scan"></div>
  <div class="sweep"></div>
</div>
</body>
</html>
