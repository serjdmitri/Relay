<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src file: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self';">
<title>Photo from your phone</title>
<script src="look-window.js"></script>
<style>
  /* A photo flicked from the phone: black glass like the answer card, the picture, and a few buttons. */
  :root { --ink: #f4f7fa; --dim: rgba(240, 246, 252, .62); --acc: #6fd3ff; --line: rgba(111, 211, 255, .38); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }
  #card { position: absolute; inset: 0; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: #05090d; border: 1px solid var(--line); border-radius: 22px; box-shadow: inset 0 0 28px rgba(111, 211, 255, .08); -webkit-app-region: drag; opacity: 0; transform: scale(.94); transition: opacity .22s ease-out, transform .22s ease-out; }
  body.in #card { opacity: 1; transform: none; }
  button, input { -webkit-app-region: no-drag; font: inherit; color: inherit; }
  #x { position: absolute; top: 8px; right: 8px; z-index: 3; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .55); color: var(--ink); font-size: 14px; line-height: 1; }
  #imgwrap { position: relative; flex: none; width: 344px; height: 258px; border-radius: 12px; overflow: hidden; background: #0b1218; }
  #pic { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; transition: opacity .45s ease-out; }
  #imgwrap.intro #pic { opacity: 0; } /* while the hologram reveal plays, the real picture waits underneath */
  #holo { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; transition: opacity .45s ease-out; }
  #imgwrap.cropping { cursor: crosshair; -webkit-app-region: no-drag; }
  #imgwrap.cropping #pic { pointer-events: auto; }
  #sel { position: absolute; border: 1.5px solid var(--acc); box-shadow: 0 0 0 9999px rgba(0, 0, 0, .55); pointer-events: none; }
  #meta { width: 100%; display: flex; align-items: baseline; gap: 8px; min-height: 30px; }
  #name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ext { color: var(--acc); font-size: 11px; font-weight: 700; letter-spacing: .06em; }
  #info { color: var(--dim); font-size: 11.5px; }
  #rename { flex: 1; min-width: 0; padding: 5px 9px; border-radius: 9px; border: 1px solid var(--line); background: #0b1218; outline: 0; }
  #msg { width: 100%; min-height: 18px; font-size: 12px; color: var(--dim); text-align: center; }
  #msg.bad { color: #fca5a5; }
  .bar { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .bar.wide { grid-template-columns: repeat(3, 1fr); }
  .bar button { height: 36px; border-radius: 11px; border: 1px solid var(--line); background: rgba(14, 30, 44, .85); font-size: 12.5px; font-weight: 600; }
  .bar button:hover { background: rgba(40, 80, 110, .85); }
  .bar button:active { background: var(--acc); color: #00141c; }
  .bar button:disabled { opacity: .4; }
  .bar button.go { background: #1c8fd6; border-color: var(--acc); }
  .bar button.danger { color: #fca5a5; }
  .hint { width: 100%; text-align: center; color: var(--dim); font-size: 12px; }
  [hidden] { display: none !important; }
  /* the look chosen in Settings > Appearance (look-window.js); Cockpit Lite is the card as it was */
  html[data-look="glass"] #card { background: linear-gradient(180deg, rgba(22, 31, 42, .94), rgba(10, 15, 22, .96)); border-color: rgba(255, 255, 255, .2); border-radius: 28px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 18px 46px rgba(0, 0, 0, .5); }
  html[data-look="glass"] .bar button { border-radius: 999px; background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .16); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22); }
  html[data-look="glass"] #imgwrap { border-radius: 18px; }
  html[data-look="instrument"] #card { background: #0b0f14; border-color: #1f2a35; border-radius: 10px; }
  html[data-look="instrument"] .bar button { background: #11171e; border-color: #1f2a35; border-radius: 6px; }
  html[data-look="instrument"] #imgwrap { border-radius: 6px; }
  html[data-look="studio"] #card { background: #151d27; border-color: rgba(255, 255, 255, .1); border-radius: 24px; box-shadow: 0 12px 34px rgba(0, 0, 0, .45); }
  html[data-look="studio"] .bar button { background: #1c2733; border-color: rgba(255, 255, 255, .1); border-radius: 14px; height: 40px; }
  html[data-look="studio"] #imgwrap { border-radius: 16px; }
  html[data-look="buddy"] #card { background: #18212c; border-color: rgba(255, 255, 255, .14); border-radius: 32px; box-shadow: 0 14px 36px rgba(0, 0, 0, .4); }
  html[data-look="buddy"] .bar button { background: #243142; border-color: rgba(255, 255, 255, .14); border-radius: 18px; height: 40px; }
  html[data-look="buddy"] #imgwrap { border-radius: 22px; }
</style>
</head>
<body>
<div id="card">
  <button id="x" type="button" aria-label="Close">&#10005;</button>
  <div id="imgwrap"><img id="pic" alt=""><canvas id="holo" hidden></canvas><div id="sel" hidden></div></div>
  <div id="meta">
    <span id="name"><span id="base"></span></span><span id="ext"></span><span id="info"></span>
    <input id="rename" type="text" maxlength="120" spellcheck="false" hidden>
  </div>
  <div id="msg"></div>
  <div class="bar" id="bar-main">
    <button type="button" data-act="save">Save as</button>
    <button type="button" data-act="share" id="share">Share</button>
    <button type="button" data-mode="crop">Crop</button>
    <button type="button" data-mode="type">Type</button>
    <button type="button" data-mode="rename">Rename</button>
    <button type="button" data-act="copy">Copy</button>
    <button type="button" data-act="reveal">Finder</button>
    <button type="button" data-act="trash" class="danger">Trash</button>
  </div>
  <div id="bar-crop" hidden style="width:100%">
    <div class="hint">Drag over the photo to choose the part to keep.</div>
    <div class="bar wide" style="margin-top:6px"><button type="button" id="cropcancel">Cancel</button><span></span><button type="button" id="keep" class="go" disabled>Keep this part</button></div>
  </div>
  <div id="bar-type" hidden style="width:100%">
    <div class="hint">Change the file type (the original stays).</div>
    <div class="bar" style="margin-top:6px"><button type="button" data-format="jpg">JPG</button><button type="button" data-format="png">PNG</button><button type="button" data-format="heic">HEIC</button><button type="button" data-format="tiff">TIFF</button></div>
    <div class="bar wide" style="margin-top:6px"><span></span><button type="button" id="typeback">Back</button><span></span></div>
  </div>
</div>
<script src="flick-card.js"></script>
</body>
</html>
