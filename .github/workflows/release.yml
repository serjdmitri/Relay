name: Release

# Builds the .dmg files on a macOS runner. Creating a release with a tag like v0.1.0 on GitHub
# triggers this; the dmgs are attached to that release. "Run workflow" builds without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    # The dictation helper needs the macOS 26 SDK. It is compiled natively, so each arch builds on its own runner.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: bash scripts/make-dmg.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Relay-${{ matrix.arch }}-dmg
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: dmg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dmgs
          merge-multiple: true
      - name: Attach to the release (create it if it does not exist yet)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dmgs
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            NOTES="docs/release-notes-$TAG.md"
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --title "Relay $TAG" --prerelease --notes-file "$NOTES"
            else
              gh release create "$TAG" --title "Relay $TAG" --prerelease --generate-notes
            fi
          fi
          gh release upload "$TAG" dmgs/*.dmg --clobber
