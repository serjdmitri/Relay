<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-label="A mock screen showing the hand control message as a small card in the bottom left and a fist badge at the mouse pointer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1118"/><stop offset="0.6" stop-color="#0d2a42"/><stop offset="1" stop-color="#11486e"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#02080e" flood-opacity="0.5"/></filter>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4cc2ff"/></marker>
</defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1200" height="590" rx="20" fill="url(#bg)"/>
<text x="600" y="54" font-size="28" fill="#e9f8ff" font-weight="700" text-anchor="middle" >Messages in the corner</text><text x="600" y="82" font-size="14" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Hand control messages appear bottom left, not as the big Jarvis pill in the middle. Clicks pass straight through.</text><rect x="150" y="112" width="900" height="440" rx="16" fill="#0a2236" stroke="#243b52" stroke-width="2" filter="url(#sh)"/><rect x="150" y="112" width="900" height="26" rx="16" fill="#050b11" opacity="0.8"/><text x="166" y="130" font-size="11" fill="#8fa8bd" font-weight="400" text-anchor="start" >  Relay   File   Edit   View</text><rect x="400" y="232" width="400" height="190" rx="12" fill="#0e3050" opacity="0.7"/><rect x="420" y="254" width="200" height="12" rx="6" fill="#1d4a70"/><rect x="420" y="280" width="340" height="9" rx="4" fill="#17405f"/><rect x="420" y="300" width="300" height="9" rx="4" fill="#17405f"/><rect x="174" y="440" width="360" height="88" rx="16" fill="#0e1424" stroke="#4cc2ff" stroke-opacity="0.6" filter="url(#sh)"/><circle cx="198" cy="484" r="6" fill="#4cc2ff"/><text x="216" y="474" font-size="13" fill="#e9f8ff" font-weight="400" text-anchor="start" >Hand control is on. Open hand moves</text><text x="216" y="494" font-size="13" fill="#e9f8ff" font-weight="400" text-anchor="start" >the ring, a fist grabs, a pinch clicks,</text><text x="216" y="514" font-size="13" fill="#e9f8ff" font-weight="400" text-anchor="start" >a wave talks to Jarvis.</text><path d="M710,362 l0,26 l7,-6 l5,12 l5,-2 l-5,-12 l9,0 z" fill="#fff" stroke="#000" stroke-width="1"/><circle cx="746" cy="398" r="18" fill="#14203a" stroke="#4cc2ff" stroke-width="2.5"/><text x="746" y="406" font-size="20" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">✊</text><text x="355" y="428" font-size="12" fill="#4cc2ff" font-weight="600" text-anchor="middle" >bottom left</text><text x="746" y="442" font-size="12" fill="#4cc2ff" font-weight="600" text-anchor="middle" >badge at the pointer</text>
</g></svg>
