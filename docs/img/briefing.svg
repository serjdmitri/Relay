<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="The morning briefing: the first open of the day speaks every part you chose, later opens show the weather and only speak what is new">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1118"/><stop offset="0.6" stop-color="#0d2a42"/><stop offset="1" stop-color="#11486e"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#02080e" flood-opacity="0.5"/></filter>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4cc2ff"/></marker>
</defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1200" height="470" rx="20" fill="url(#bg)"/>
<text x="600" y="54" font-size="28" fill="#e9f8ff" font-weight="700" text-anchor="middle" >Morning briefing</text><text x="600" y="82" font-size="14" fill="#8fa8bd" font-weight="400" text-anchor="middle" >You choose what Jarvis says out loud. Later opens only say what is new.</text><rect x="40" y="112" width="540" height="330" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="68" y="152" font-size="18" fill="#e9f8ff" font-weight="700" text-anchor="start" >First open of the day</text><text x="68" y="176" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="start" >Early morning: everything you chose</text><rect x="62" y="204" width="496" height="44" rx="10" fill="#0c1823" stroke="#243b52"/><text x="90" y="235" font-size="22" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">📅</text><text x="118" y="232" font-size="15" fill="#e9f8ff" font-weight="600" text-anchor="start" >Calendar</text><text x="544" y="232" font-size="13" fill="#4cc2ff" font-weight="600" text-anchor="end" >spoken</text><rect x="62" y="260" width="496" height="44" rx="10" fill="#0c1823" stroke="#243b52"/><text x="90" y="291" font-size="22" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">✉️</text><text x="118" y="288" font-size="15" fill="#e9f8ff" font-weight="600" text-anchor="start" >Mail</text><text x="544" y="288" font-size="13" fill="#4cc2ff" font-weight="600" text-anchor="end" >spoken</text><rect x="62" y="316" width="496" height="44" rx="10" fill="#0c1823" stroke="#243b52"/><text x="90" y="347" font-size="22" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">☁️</text><text x="118" y="344" font-size="15" fill="#e9f8ff" font-weight="600" text-anchor="start" >Weather</text><text x="544" y="344" font-size="13" fill="#8fa8bd" font-weight="600" text-anchor="end" >shown only</text><rect x="62" y="372" width="496" height="44" rx="10" fill="#0c1823" stroke="#243b52"/><text x="90" y="403" font-size="22" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">👁️</text><text x="118" y="400" font-size="15" fill="#e9f8ff" font-weight="600" text-anchor="start" >Things you watch</text><text x="544" y="400" font-size="13" fill="#4cc2ff" font-weight="600" text-anchor="end" >spoken</text><rect x="620" y="112" width="540" height="330" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="648" y="152" font-size="18" fill="#e9f8ff" font-weight="700" text-anchor="start" >Opened again later</text><text x="648" y="176" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="start" >Does not repeat itself</text><rect x="642" y="204" width="496" height="44" rx="10" fill="#0c1823" stroke="#243b52"/><text x="670" y="235" font-size="22" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">☁️</text><text x="698" y="232" font-size="15" fill="#e9f8ff" font-weight="600" text-anchor="start" >Weather</text><text x="1124" y="232" font-size="13" fill="#8fa8bd" font-weight="600" text-anchor="end" >shown only</text><rect x="642" y="260" width="496" height="44" rx="10" fill="#0c1823" stroke="#243b52"/><text x="670" y="291" font-size="22" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🆕</text><text x="698" y="288" font-size="15" fill="#e9f8ff" font-weight="600" text-anchor="start" >New since earlier</text><text x="1124" y="288" font-size="13" fill="#4cc2ff" font-weight="600" text-anchor="end" >spoken</text><rect x="642" y="316" width="496" height="44" rx="10" fill="#0c1823" stroke="#243b52"/><text x="670" y="347" font-size="22" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">📅</text><text x="698" y="344" font-size="15" fill="#e9f8ff" font-weight="600" text-anchor="start" >Calendar, unchanged</text><text x="1124" y="344" font-size="13" fill="#8fa8bd" font-weight="600" text-anchor="end" >skipped</text><rect x="642" y="372" width="496" height="44" rx="10" fill="#0c1823" stroke="#243b52"/><text x="670" y="403" font-size="22" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">✉️</text><text x="698" y="400" font-size="15" fill="#e9f8ff" font-weight="600" text-anchor="start" >Mail, already read</text><text x="1124" y="400" font-size="13" fill="#8fa8bd" font-weight="600" text-anchor="end" >skipped</text>
</g></svg>
