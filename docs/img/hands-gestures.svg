<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-label="The hand gestures Relay understands: fist, open hand, pinch, twist for volume, wave, call-me sign, fingers for tabs, thumbs, two palms, two-hand resize and pulling a model apart">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1118"/><stop offset="0.6" stop-color="#0d2a42"/><stop offset="1" stop-color="#11486e"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#02080e" flood-opacity="0.5"/></filter>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4cc2ff"/></marker>
</defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1200" height="570" rx="20" fill="url(#bg)"/>
<text x="600" y="54" font-size="28" fill="#e9f8ff" font-weight="700" text-anchor="middle" >Hand control</text><text x="600" y="82" font-size="14" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Hold a fist to the camera, then use your hands. It turns itself off after 30 seconds with no hand in view.</text><rect x="30" y="112" width="270" height="150" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="165.0" y="180" font-size="44" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">✊</text><text x="165.0" y="217" font-size="16" fill="#e9f8ff" font-weight="650" text-anchor="middle" >Fist, held</text><text x="165.0" y="240" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Turn hand control on</text><rect x="320" y="112" width="270" height="150" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="455.0" y="180" font-size="44" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">✋</text><text x="455.0" y="217" font-size="16" fill="#e9f8ff" font-weight="650" text-anchor="middle" >Open hand</text><text x="455.0" y="240" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Move the ring</text><rect x="610" y="112" width="270" height="150" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="745.0" y="180" font-size="44" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🤏</text><text x="745.0" y="217" font-size="16" fill="#e9f8ff" font-weight="650" text-anchor="middle" >Pinch</text><text x="745.0" y="240" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Click, or hold and drag</text><rect x="900" y="112" width="270" height="150" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><path d="M1001.0,178 A34,34 0 1 1 1069.0,178" fill="none" stroke="#243b52" stroke-width="7" stroke-linecap="round"/><path d="M1001.0,178 A34,34 0 0 1 1053.0,149" fill="none" stroke="#4cc2ff" stroke-width="7" stroke-linecap="round"/><text x="1035.0" y="188" font-size="30" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🤏</text><text x="1069.0" y="152" font-size="16" fill="#e9f8ff" font-weight="400" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🔊</text><text x="1035.0" y="217" font-size="16" fill="#e9f8ff" font-weight="650" text-anchor="middle" >Pinch, hold, twist</text><text x="1035.0" y="240" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Volume up or down</text><rect x="30" y="280" width="270" height="150" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="165.0" y="348" font-size="44" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">👋</text><text x="165.0" y="385" font-size="16" fill="#e9f8ff" font-weight="650" text-anchor="middle" >Wave</text><text x="165.0" y="408" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Talk to Jarvis</text><rect x="320" y="280" width="270" height="150" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="455.0" y="348" font-size="44" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🤙</text><text x="455.0" y="385" font-size="16" fill="#e9f8ff" font-weight="650" text-anchor="middle" >Call me</text><text x="455.0" y="408" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Talk to Jarvis, any app</text><rect x="610" y="280" width="270" height="150" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="745.0" y="348" font-size="44" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">✌️</text><text x="745.0" y="385" font-size="16" fill="#e9f8ff" font-weight="650" text-anchor="middle" >Fingers 1 to 5</text><text x="745.0" y="408" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Switch browser tab</text><rect x="900" y="280" width="270" height="150" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="1035.0" y="348" font-size="44" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">👍</text><text x="1035.0" y="385" font-size="16" fill="#e9f8ff" font-weight="650" text-anchor="middle" >Thumb up</text><text x="1035.0" y="408" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Keep the hologram</text><rect x="30" y="448" width="270" height="150" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="165.0" y="516" font-size="44" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">👎</text><text x="165.0" y="553" font-size="16" fill="#e9f8ff" font-weight="650" text-anchor="middle" >Thumb down</text><text x="165.0" y="576" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Close it</text><rect x="320" y="448" width="270" height="150" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="455.0" y="516" font-size="44" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🙌</text><text x="455.0" y="553" font-size="16" fill="#e9f8ff" font-weight="650" text-anchor="middle" >Two palms, 1.5 s</text><text x="455.0" y="576" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Pause or resume</text><rect x="610" y="448" width="270" height="150" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="745.0" y="516" font-size="44" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🤏🤏</text><text x="745.0" y="553" font-size="16" fill="#e9f8ff" font-weight="650" text-anchor="middle" >Two hands pinching</text><text x="745.0" y="576" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Resize and roll</text><rect x="900" y="448" width="270" height="150" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="1035.0" y="516" font-size="30" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">✊↔✊</text><text x="1035.0" y="553" font-size="16" fill="#e9f8ff" font-weight="650" text-anchor="middle" >Two fists apart</text><text x="1035.0" y="576" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Take a model apart</text>
</g></svg>
