<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-label="The two-finger swipe: two fingers up, point them at the camera, turn them left or right to move one desktop, with the badge states ready, turning, not you and moved">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1118"/><stop offset="0.6" stop-color="#0d2a42"/><stop offset="1" stop-color="#11486e"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#02080e" flood-opacity="0.5"/></filter>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4cc2ff"/></marker>
</defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1200" height="590" rx="20" fill="url(#bg)"/>
<text x="600" y="54" font-size="28" fill="#e9f8ff" font-weight="700" text-anchor="middle" >Two-finger desktop swipe</text><text x="600" y="82" font-size="14" fill="#8fa8bd" font-weight="400" text-anchor="middle" >No hand control needed. One swipe moves one desktop, and only for you: a stranger in view blocks it.</text><rect x="40" y="112" width="340" height="170" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="210" y="192" font-size="60" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">✌️</text><text x="210" y="240" font-size="17" fill="#e9f8ff" font-weight="650" text-anchor="middle" >1  Two fingers up</text><text x="210" y="264" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Held for a moment</text><path d="M386,197 L414,197" stroke="#4cc2ff" stroke-width="3" marker-end="url(#ar)"/><rect x="420" y="112" width="340" height="170" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="590" y="192" font-size="60" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">👉</text><text x="590" y="240" font-size="17" fill="#e9f8ff" font-weight="650" text-anchor="middle" >2  Point at the camera</text><text x="590" y="264" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="middle" >The fingers look short</text><path d="M766,197 L794,197" stroke="#4cc2ff" stroke-width="3" marker-end="url(#ar)"/><rect x="800" y="112" width="340" height="170" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="970" y="192" font-size="60" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">↩️</text><text x="970" y="240" font-size="17" fill="#e9f8ff" font-weight="650" text-anchor="middle" >3  Turn them</text><text x="970" y="264" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Left or right: one desktop</text><text x="600" y="330" font-size="13" fill="#8fa8bd" font-weight="600" text-anchor="middle" >Your desktops</text><rect x="270" y="346" width="200" height="118" rx="12" fill="#111c29" stroke="#243b52" stroke-width="1" filter="url(#sh)"/><rect x="280" y="356" width="180" height="10" rx="5" fill="#243b52"/><rect x="286" y="378" width="70" height="46" rx="6" fill="#243b52" opacity="0.7"/><text x="370" y="452" font-size="12" fill="#8fa8bd" font-weight="600" text-anchor="middle" >Desktop 1</text><rect x="500" y="346" width="200" height="118" rx="12" fill="#123452" stroke="#4cc2ff" stroke-width="3" filter="url(#sh)"/><rect x="510" y="356" width="180" height="10" rx="5" fill="#243b52"/><rect x="516" y="378" width="90" height="46" rx="6" fill="#243b52" opacity="0.7"/><text x="600" y="452" font-size="12" fill="#e9f8ff" font-weight="600" text-anchor="middle" >Desktop 2</text><rect x="730" y="346" width="200" height="118" rx="12" fill="#111c29" stroke="#243b52" stroke-width="1" filter="url(#sh)"/><rect x="740" y="356" width="180" height="10" rx="5" fill="#243b52"/><rect x="746" y="378" width="110" height="46" rx="6" fill="#243b52" opacity="0.7"/><text x="830" y="452" font-size="12" fill="#8fa8bd" font-weight="600" text-anchor="middle" >Desktop 3</text><path d="M262,405 L214,405" stroke="#4cc2ff" stroke-width="3" marker-end="url(#ar)"/><path d="M738,405 L786,405" stroke="#4cc2ff" stroke-width="3" marker-end="url(#ar)"/><text x="238" y="388" font-size="11" fill="#8fa8bd" font-weight="400" text-anchor="middle" >turn left</text><text x="762" y="388" font-size="11" fill="#8fa8bd" font-weight="400" text-anchor="middle" >turn right</text><text x="600" y="508" font-size="13" fill="#8fa8bd" font-weight="600" text-anchor="middle" >The badge at your mouse pointer shows what the camera sees</text><circle cx="210" cy="548" r="20" fill="#14203a" stroke="#4cc2ff" stroke-width="2.5"/><text x="210" y="556" font-size="20" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">✌️</text><text x="242" y="553" font-size="14" fill="#e9f8ff" font-weight="600" text-anchor="start" >Ready</text><circle cx="430" cy="548" r="20" fill="#14203a" stroke="#a78bfa" stroke-width="2.5"/><text x="430" y="556" font-size="20" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">👉</text><text x="462" y="553" font-size="14" fill="#e9f8ff" font-weight="600" text-anchor="start" >Turning</text><circle cx="650" cy="548" r="20" fill="#14203a" stroke="#9ca3af" stroke-width="2.5"/><text x="650" y="556" font-size="20" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">✌️</text><text x="682" y="553" font-size="14" fill="#e9f8ff" font-weight="600" text-anchor="start" >Not you</text><circle cx="870" cy="548" r="20" fill="#14203a" stroke="#86efac" stroke-width="2.5"/><text x="870" y="556" font-size="20" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">▶</text><text x="902" y="553" font-size="14" fill="#e9f8ff" font-weight="600" text-anchor="start" >Moved</text>
</g></svg>
