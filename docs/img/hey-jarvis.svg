<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="How Hey Jarvis works: microphone, voice activity detection, wake-word model, then the pill opens; with a strictness slider and a near-miss log">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1118"/><stop offset="0.6" stop-color="#0d2a42"/><stop offset="1" stop-color="#11486e"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#02080e" flood-opacity="0.5"/></filter>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4cc2ff"/></marker>
</defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1200" height="470" rx="20" fill="url(#bg)"/>
<text x="600" y="54" font-size="28" fill="#e9f8ff" font-weight="700" text-anchor="middle" >"Hey Jarvis"</text><text x="600" y="82" font-size="14" fill="#8fa8bd" font-weight="400" text-anchor="middle" >A dedicated wake-word model, listening on this Mac. Nothing is recorded or sent.</text><rect x="36" y="118" width="252" height="160" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="162" y="188" font-size="46" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🎙️</text><text x="162" y="230" font-size="17" fill="#e9f8ff" font-weight="650" text-anchor="middle" >Microphone</text><text x="162" y="254" font-size="12.5" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Audio stays on this Mac</text><path d="M292,198 L324,198" stroke="#4cc2ff" stroke-width="3" marker-end="url(#ar)"/><rect x="328" y="118" width="252" height="160" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="454" y="188" font-size="46" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">〰️</text><text x="454" y="230" font-size="17" fill="#e9f8ff" font-weight="650" text-anchor="middle" >Voice activity</text><text x="454" y="254" font-size="12.5" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Silero: is anyone speaking?</text><path d="M584,198 L616,198" stroke="#4cc2ff" stroke-width="3" marker-end="url(#ar)"/><rect x="620" y="118" width="252" height="160" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="746" y="188" font-size="46" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🧠</text><text x="746" y="230" font-size="17" fill="#e9f8ff" font-weight="650" text-anchor="middle" >Wake-word model</text><text x="746" y="254" font-size="12.5" fill="#8fa8bd" font-weight="400" text-anchor="middle" >openWakeWord: "Hey Jarvis"</text><path d="M876,198 L908,198" stroke="#4cc2ff" stroke-width="3" marker-end="url(#ar)"/><rect x="912" y="118" width="252" height="160" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="1038" y="188" font-size="46" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">💬</text><text x="1038" y="230" font-size="17" fill="#e9f8ff" font-weight="650" text-anchor="middle" >The pill opens</text><text x="1038" y="254" font-size="12.5" fill="#8fa8bd" font-weight="400" text-anchor="middle" >Jarvis listens to your ask</text><rect x="36" y="312" width="1128" height="130" rx="14" fill="#111c29" stroke="#243b52" filter="url(#sh)"/><text x="66" y="348" font-size="15" fill="#e9f8ff" font-weight="650" text-anchor="start" >Wake strictness</text><text x="66" y="372" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="start" >Looser hears you more often; stricter fires less on other speech.</text><rect x="66" y="396" width="480" height="8" rx="4" fill="#243b52"/><rect x="66" y="396" width="260" height="8" rx="4" fill="#4cc2ff"/><circle cx="326" cy="400" r="11" fill="#fff" stroke="#4cc2ff" stroke-width="3"/><text x="66" y="428" font-size="12" fill="#8fa8bd" font-weight="400" text-anchor="start" >looser</text><text x="546" y="428" font-size="12" fill="#8fa8bd" font-weight="400" text-anchor="end" >stricter</text><text x="620" y="348" font-size="15" fill="#e9f8ff" font-weight="650" text-anchor="start" >Near misses are logged</text><text x="620" y="372" font-size="13" fill="#8fa8bd" font-weight="400" text-anchor="start" >so you can tune the slider from real data:</text><rect x="620" y="384" width="510" height="42" rx="8" fill="#08121c" stroke="#243b52"/><text x="634" y="410" font-size="13" fill="#a5d8f3" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace">wake-near  score 0.46  (needs 0.50)</text>
</g></svg>
